v style=\"border-radius:26px;background:#F2F2F7;overflow:hidden\">\n            <div style=\"padding:14px 16px 8px\"><div style=\"font-size:11px;font-weight:600;letter-spacing:0.6px;text-transform:uppercase;color:#6D83A3\">Aug 22–29<\u002Fdiv><div style=\"font-size:16px;font-weight:700;letter-spacing:-0.3px;margin-top:2px\">Your stay on Sankaty Head<\u002Fdiv><\u002Fdiv>\n            <div style=\"margin:6px 12px;background:#09182C;border-radius:12px;padding:13px 14px;color:#fff\">\n              <div style=\"font-size:11px;font-weight:600;letter-spacing:0.6px;text-transform:uppercase;color:#A1DBF5\">Check-in Saturday · 4:00 PM<\u002Fdiv>\n              <div style=\"font-size:12px;margin-top:5px;color:rgba(255,255,255,0.85)\">Door code arrives at 2:00 PM. Park in the shell drive.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin:8px 12px;background:#fff;border-radius:12px;padding:12px 14px;border:1px solid rgba(60,60,67,0.1)\">\n              <div style=\"font-size:12px;font-weight:600\">Home guide<\u002Fdiv>\n              <div style=\"font-size:11px;color:#6D83A3;margin-top:3px\">Wi-Fi · trash day · grill · beach gear<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin:8px 12px;background:#fff;border-radius:12px;padding:12px 14px;border:1px solid rgba(60,60,67,0.1)\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center\"><span style=\"font-size:12px;font-weight:600\">Messages<\u002Fspan><span style=\"width:16px;height:16px;border-radius:999px;background:#15A5E5;color:#fff;font-size:9.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center\">1<\u002Fspan><\u002Fdiv>\n              <div style=\"font-size:11px;color:#6D83A3;margin-top:3px\">Kate (Nantucket Houses): “Extra towels are in…”<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin:10px 12px 12px;border-radius:999px;background:rgba(255,255,255,0.82);border:1px solid rgba(60,60,67,0.12);padding:7px 12px;display:flex;justify-content:space-between\"><span style=\"font-size:9px;font-weight:600;color:#09182C\">My Stay<\u002Fspan><span style=\"font-size:9px;font-weight:500;color:#6D83A3\">Guide<\u002Fspan><span style=\"font-size:9px;font-weight:500;color:#6D83A3\">Messages<\u002Fspan><span style=\"font-size:9px;font-weight:500;color:#6D83A3\">More<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:10px\"><span style=\"font-size:10px;font-weight:600;letter-spacing:0.6px;text-transform:uppercase;color:#6D83A3;background:#F2F2F7;border:1px solid rgba(60,60,67,0.12);padding:2px 7px;border-radius:4px\">Handoff<\u002Fspan><span style=\"font-size:12px;font-weight:600\">Rebook → NR<\u002Fspan><\u002Fdiv>\n        <div style=\"border-radius:34px;border:1px solid rgba(60,60,67,0.18);background:#F2F2F7;padding:10px;box-shadow:0 6px 22px rgba(9,24,44,0.08)\">\n          <div style=\"border-radius:26px;background:rgba(12,20,40,0.22);overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;min-height:372px\">\n            <div style=\"background:#fff;border-radius:24px 24px 26px 26px;padding:16px 16px 14px\">\n              <div style=\"width:34px;height:4px;border-radius:999px;background:#DEE1EB;margin:0 auto 12px\"><\u002Fdiv>\n              <div style=\"font-size:14px;font-weight:700;letter-spacing:-0.2px\">Book next summer?<\u002Fdiv>\n              <p style=\"margin:6px 0 0;font-size:11.5px;line-height:1.55;color:rgba(9,24,44,0.85)\">Booking and availability live on <strong>NantucketRentals.com<\u002Fstrong> — we'll take you there. Your stay details stay right here.<\u002Fp>\n              <p style=\"margin:8px 0 0;font-size:10px;line-height:1.5;color:#959DAB\">NantucketRentals.com and Nantucket Houses share common ownership.<\u002Fp>\n              <div style=\"margin-top:12px;border-radius:12px;background:linear-gradient(180deg,rgba(21,165,229,0.98),rgba(17,132,183,0.92));color:#fff;font-size:12px;font-weight:600;text-align:center;padding:11px 0\">Continue to NantucketRentals.com<\u002Fdiv>\n              <div style=\"margin-top:8px;font-size:11.5px;font-weight:600;color:#0369A1;text-align:center;padding:6px 0\">Not now<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n      <div style=\"background:#fff;border-radius:12px;padding:22px 26px;border:1px solid rgba(60,60,67,0.12)\">\n        <div style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#6D83A3;margin-bottom:10px\">Status, compliance &amp; documents<\u002Fdiv>\n        <div style=\"display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px\">\n          <span style=\"font-size:10.5px;font-weight:600;letter-spacing:0.6px;text-transform:uppercase;color:#0A7A4B;background:#ECFDF3;padding:3px 9px;border-radius:4px\">Verified<\u002Fspan>\n          <span style=\"font-size:10.5px;font-weight:600;letter-spacing:0.6px;text-transform:uppercase;color:#B45309;background:#FEF3C7;padding:3px 9px;border-radius:4px\">Action needed<\u002Fspan>\n          <span style=\"font-size:10.5px;font-weight:600;letter-spacing:0.6px;text-transform:uppercase;color:#B42318;background:#FEF2F2;padding:3px 9px;border-radius:4px\">Expired<\u002Fspan>\n          <span style=\"font-size:10.5px;font-weight:600;letter-spacing:0.6px;text-transform:uppercase;color:#0369A1;background:#E0F2FE;padding:3px 9px;border-radius:4px\">Official record<\u002Fspan>\n        <\u002Fdiv>\n        <ul style=\"margin:0;padding-left:16px;font-size:12px;line-height:1.75;color:rgba(9,24,44,0.85)\">\n          <li>Status pills state evidence, never judgment: “Verified · Town of Nantucket, Aug 2026”, not “All set!”<\u002Fli>\n          <li>Compliance items list requirement + source + due date + one action; never overstated, never alarmist before due<\u002Fli>\n          <li>Documents: editorial cards (radius 12), filename + type + date + status pill; irreversible submissions follow the high-stakes pattern; signed documents carry the C&amp;C legal-entity line in caption type<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border-radius:12px;padding:22px 26px;border:1px solid rgba(60,60,67,0.12)\">\n        <div style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#6D83A3;margin-bottom:10px\">Messaging &amp; tasks<\u002Fdiv>\n        <ul style=\"margin:0;padding-left:16px;font-size:12px;line-height:1.75;color:rgba(9,24,44,0.85)\">\n          <li>Conversation UI: sender name + role on every human message; Odin messages labeled “Odin · assistant” with a persistent “Talk to a person” action<\u002Fli>\n          <li>Inbound bubbles white on panel; outbound sky fill #E0F2FE with ink text — no brand-blue bubbles (legibility)<\u002Fli>\n          <li>Timestamps grouped by day; read states quiet (caption, English Manor)<\u002Fli>\n          <li>Tasks: circle-check rows, one verb each (“Confirm trash day”), grouped by due date; completing checks + collapses in 220 ms<\u002Fli>\n          <li>Activation progress: n-of-m bar (never percentages), always names the next task; stalls prompt once by email after 7 days — never by push<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"s9\" data-screen-label=\"09 Governance\" style=\"scroll-margin-top:24px;margin-bottom:60px\">\n    <div style=\"font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#15A5E5;margin-bottom:6px\">Section 09<\u002Fdiv>\n    <h2 style=\"margin:0 0 6px;font-size:27px;font-weight:700;letter-spacing:-0.5px\">Governance &amp; guardrails<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0 16px\">\n      <div style=\"background:#fff;border-radius:12px;padding:22px 26px;border:1px solid rgba(60,60,67,0.12)\">\n        <div style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#6D83A3;margin-bottom:10px\">NH is the sole visible brand when…<\u002Fdiv>\n        <ul style=\"margin:0;padding-left:16px;font-size:12.5px;line-height:1.8;color:rgba(9,24,44,0.85)\">\n          <li>Home operations, home guides, stay logistics, tasks<\u002Fli>\n          <li>In-app messaging and service notifications<\u002Fli>\n          <li>Document storage and status (C&amp;C legal identity appears as text on legal documents themselves)<\u002Fli>\n        <\u002Ful>\n        <div style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#6D83A3;margin:16px 0 10px\">Transparent affiliation is required when…<\u002Fdiv>\n        <ul style=\"margin:0;padding-left:16px;font-size:12.5px;line-height:1.8;color:rgba(9,24,44,0.85)\">\n          <li>Any handoff to NR or C&amp;C (named, with consent, before data moves)<\u002Fli>\n          <li>Email footers, account creation, listing attribution<\u002Fli>\n          <li>Anywhere common ownership could plausibly be missed — when in doubt, disclose<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border-radius:12px;padding:22px 26px;border:1px solid rgba(60,60,67,0.12)\">\n        <div style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#6D83A3;margin-bottom:10px\">Approval &amp; AI rules<\u002Fdiv>\n        <ul style=\"margin:0;padding-left:16px;font-size:12.5px;line-height:1.8;color:rgba(9,24,44,0.85)\">\n          <li><strong>Stephen approves all deviations<\u002Fstrong> from this guide before they ship — no exceptions for “small” surfaces; a push notification is a brand surface<\u002Fli>\n          <li>Template and string changes in nrbe / CNC / Odin / the iOS app follow the same rules as designed surfaces and go through PR review<\u002Fli>\n          <li>Automated and AI-assisted messages stay within NH voice, disclose Odin as an assistant, never make valuation claims or legal statements, and escalate stay/safety/complaint issues through Odin to the accountable human team<\u002Fli>\n          <li>Run the red-team battery against any new or changed template or automated flow; a compliant system refuses or re-routes every prompt<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border-radius:12px;border:1px solid rgba(60,60,67,0.12);padding:8px 26px;margin-bottom:16px\">\n      <div style=\"display:grid;grid-template-columns:170px 1fr 1fr;gap:16px;padding:12px 0;border-bottom:1px solid rgba(60,60,67,0.08);font-size:10.5px;font-weight:600;letter-spacing:0.6px;text-transform:uppercase;color:#6D83A3\"><span>Sibling brand<\u002Fspan><span style=\"color:#B42318\">NH never<\u002Fspan><span style=\"color:#0A7A4B\">NH instead<\u002Fspan><\u002Fdiv>\n      <sc-for list=\"{{ brandBoundaries }}\" as=\"b\" hint-placeholder-count=\"3\">\n        <div style=\"display:grid;grid-template-columns:170px 1fr 1fr;gap:16px;padding:13px 0;border-bottom:1px solid rgba(60,60,67,0.08);font-size:12.5px;line-height:1.6\">\n          <div style=\"font-weight:600\">{{ b.brand }}<\u002Fdiv>\n          <div style=\"color:rgba(9,24,44,0.85)\">{{ b.never }}<\u002Fdiv>\n          <div style=\"color:rgba(9,24,44,0.85)\">{{ b.instead }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"background:#09182C;border-radius:12px;padding:22px 28px;color:#fff\">\n      <div style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#A1DBF5;margin-bottom:12px\">Red-team checklist — every new template or flow must pass<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px 24px\">\n        <sc-for list=\"{{ redTeam }}\" as=\"r\" hint-placeholder-count=\"8\">\n          <div style=\"display:flex;gap:10px;align-items:baseline;font-size:12px;line-height:1.6;color:rgba(255,255,255,0.85)\"><span style=\"color:#15A5E5;font-weight:700;flex:none\">{{ r.n }}<\u002Fspan><span>{{ r.test }}<\u002Fspan><\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"s10\" data-screen-label=\"10 Token sheet\" style=\"scroll-margin-top:24px;margin-bottom:60px\">\n    <div style=\"font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#15A5E5;margin-bottom:6px\">Section 10<\u002Fdiv>\n    <h2 style=\"margin:0 0 12px;font-size:27px;font-weight:700;letter-spacing:-0.5px\">Token sheet<\u002Fh2>\n    <div style=\"background:#09182C;border-radius:12px;overflow:hidden\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-bottom:1px solid rgba(255,255,255,0.1)\">\n        <span style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#A1DBF5\">CSS custom properties — mirrors brand-tokens.ts<\u002Fspan>\n        <button sc-camel-on-click=\"{{ copyTokens }}\" style=\"font-family:inherit;cursor:pointer;font-size:11.5px;font-weight:600;padding:6px 14px;border-radius:8px;border:1px solid rgba(255,255,255,0.25);background:rgba(255,255,255,0.08);color:#fff\">{{ copyLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n      <pre id=\"nh-tokens\" style=\"margin:0;padding:18px 22px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.75;color:#D0EDFA;overflow-x:auto\">:root {\n  /* brand */\n  --nh-carolina: #15A5E5;        --nh-foundation: #1184B7;\n  --nh-blue-dark: #074059;       --nh-ink: #09182C;\n  --nh-carolina-20: #D0EDFA;     --nh-carolina-40: #A1DBF5;\n  /* interactive */\n  --nh-interactive: #0369A1;     --nh-sky-border: #BAE6FD;\n  --nh-sky-fill: #E0F2FE;        --nh-sky-fill-hover: #F0F9FF;\n  /* neutrals + surfaces */\n  --nh-text-secondary: #6D83A3;  --nh-text-muted: #959DAB;\n  --nh-bg-page: #F2F2F7;         --nh-bg-panel: #F5F9FF;\n  --nh-bg-card: #FFFFFF;         --nh-bg-canvas: #E8EDF3;\n  --nh-border-soft: rgba(60,60,67,0.12);\n  --nh-disabled: #DEE1EB;\n  /* status — success/warning/error only */\n  --nh-positive: #0A7A4B;  --nh-warning: #D97706;  --nh-critical: #B42318;\n  --nh-listing-active: #14A800;  --nh-listing-sold: #EB1648;\n  /* provenance — evidence sources only */\n  --nh-source-official: #0369A1; --nh-source-property: #0F766E;\n  --nh-source-market: #7C3AED;   --nh-source-analysis: #C2410C;\n  --nh-source-muted: #64748B;\n  /* radii */\n  --nh-radius-control: 12px;     --nh-radius-editorial: 12px;\n  --nh-radius-elevated: 24px;    --nh-radius-listing: 24px;\n  /* type */\n  --nh-font: 'Poppins', -apple-system, system-ui, sans-serif;\n  /* motion */\n  --nh-dur-state: 150ms;  --nh-dur-component: 220ms;  --nh-dur-sheet: 320ms;\n  --nh-ease: cubic-bezier(0.2, 0, 0, 1);\n  /* actions */\n  --nh-cta-gradient: linear-gradient(180deg, rgba(21,165,229,0.98), rgba(17,132,183,0.92));\n  --nh-focus-ring: 0 0 0 3px rgba(21,165,229,0.18);\n}<\u002Fpre>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"s11\" data-screen-label=\"11 Change summary\" style=\"scroll-margin-top:24px;margin-bottom:40px\">\n    <div style=\"font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#15A5E5;margin-bottom:6px\">Section 11<\u002Fdiv>\n    <h2 style=\"margin:0 0 18px;font-size:27px;font-weight:700;letter-spacing:-0.5px\">Change summary<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px\">\n      <div style=\"background:#fff;border-radius:12px;padding:22px 24px;border-top:3px solid #6D83A3;border-right:1px solid rgba(60,60,67,0.12);border-bottom:1px solid rgba(60,60,67,0.12);border-left:1px solid rgba(60,60,67,0.12)\">\n        <div style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#6D83A3;margin-bottom:10px\">Deliberately retained<\u002Fdiv>\n        <ul style=\"margin:0;padding-left:16px;font-size:12.5px;line-height:1.8;color:rgba(9,24,44,0.85)\">\n          <li>House-A wordmark, island-in-house app icon<\u002Fli>\n          <li>Full platform palette incl. Carolina Blue primary<\u002Fli>\n          <li>Poppins (now everywhere)<\u002Fli>\n          <li>Radius taxonomy 12/24, glass-for-chrome rule<\u002Fli>\n          <li>Status vs provenance token separation<\u002Fli>\n          <li>The promise, verbatim<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border-radius:12px;padding:22px 24px;border-top:3px solid #15A5E5;border-right:1px solid rgba(60,60,67,0.12);border-bottom:1px solid rgba(60,60,67,0.12);border-left:1px solid rgba(60,60,67,0.12)\">\n        <div style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#0369A1;margin-bottom:10px\">Updated for clarity &amp; system fit<\u002Fdiv>\n        <ul style=\"margin:0;padding-left:16px;font-size:12.5px;line-height:1.8;color:rgba(9,24,44,0.85)\">\n          <li>New: monogram, mono lockups, .COM rule (product drops it), clear-space + minimum sizes<\u002Fli>\n          <li>Exo retired; single-face type ladder spanning marketing + product<\u002Fli>\n          <li>Color budget rule: ~90% neutral, Carolina = action only<\u002Fli>\n          <li>Full section 8: button/form state tables, nav patterns, motion budget, loading/empty states, owner-guest surface specs<\u002Fli>\n          <li>Imagery repositioned to quiet island detail; NR multiply-overlay retired<\u002Fli>\n          <li>Voice samples, handoff + disclosure patterns, red-team battery<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border-radius:12px;padding:22px 24px;border-top:3px solid #09182C;border-right:1px solid rgba(60,60,67,0.12);border-bottom:1px solid rgba(60,60,67,0.12);border-left:1px solid rgba(60,60,67,0.12)\">\n        <div style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#09182C;margin-bottom:10px\">Must never change<\u002Fdiv>\n        <ul style=\"margin:0;padding-left:16px;font-size:12.5px;line-height:1.8;color:rgba(9,24,44,0.85)\">\n          <li>The promise wording and NH's organizing-utility role<\u002Fli>\n          <li>Rental/rebooking intent hands to NantucketRentals.com<\u002Fli>\n          <li>Valuation/representation routes to a named C&amp;C adviser with consent<\u002Fli>\n          <li>Escalations stay in service voice, through Odin, to an accountable human<\u002Fli>\n          <li>Affiliation is never concealed<\u002Fli>\n          <li>No marketing inside service flows; no editorial, funnel, or counsel voice on NH surfaces<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin:24px 0 0;font-size:11.5px;color:#959DAB\">Nantucket Houses Brand Guidelines v2.0 · Integrated Revision · August 2026 · Values sourced from nantuckethouses-platform (brand-tokens.ts, glassTheme.ts, design-system.md) · Subordinate to Nantucket Ecosystem Strategy v1.0 §3–5 · Approval: Stephen Maury<\u002Fp>\n  <\u002Fsection>\n<\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showConcepts&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Content&quot;}}\">\nclass Component extends DCLogic {\n  state = { loading: false, copied: false, email: \"\", emailState: \"idle\" };\n  renderVals() {\n    const showConcepts = this.props.showConcepts ?? true;\n    const email = this.state.email;\n    const es = this.state.emailState;\n    const valid = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email);\n    return {\n      showConcepts,\n      nav: [\n        { id: \"s1\", num: \"01\", label: \"Brand platform\" },\n        { id: \"s2\", num: \"02\", label: \"Logo system\" },\n        { id: \"s3\", num: \"03\", label: \"Color system\" },\n        { id: \"s4\", num: \"04\", label: \"Typography\" },\n        { id: \"s5\", num: \"05\", label: \"Imagery & icons\" },\n        { id: \"s6\", num: \"06\", label: \"Voice & tone\" },\n        { id: \"s7\", num: \"07\", label: \"Applications\" },\n        { id: \"s8\", num: \"08\", label: \"Digital product\" },\n        { id: \"s9\", num: \"09\", label: \"Governance\" },\n        { id: \"s10\", num: \"10\", label: \"Token sheet\" },\n        { id: \"s11\", num: \"11\", label: \"Change summary\" },\n      ],\n      personality: [\"Organized\", \"Useful\", \"Calm\", \"Reliable\", \"Island-practical\", \"Discreet\"],\n      ecosystem: [\n        { name: \"Hello Nantucket\", job: \"Editorial attention & permission\", color: \"#F59E0B\" },\n        { name: \"NantucketRentals.com\", job: \"Converts rental intent into bookings\", color: \"#15A5E5\" },\n        { name: \"Nantucket Houses\", job: \"Continuity between transactions — this guide\", color: \"#A1DBF5\" },\n        { name: \"Congdon & Coleman\", job: \"Licensed human judgment: buy, sell, value\", color: \"#8B9DC3\" },\n        { name: \"Odin\", job: \"Internal orchestration — never customer-facing\", color: \"#64748B\" },\n      ],\n      logoDonts: [\n        \"Don't recolor any element\", \"Don't distort, skew, or rotate\", \"Don't add shadows or effects\",\n        \"Don't move or rescale components\", \"Don't set the name in another face\", \"Don't place two-color version on photos or dark fills\",\n      ],\n      corePalette: [\n        { name: \"Carolina Blue\", hex: \"#15A5E5\", rgb: \"21 165 229\", cmyk: \"72/19/0/0\", role: \"Primary brand. CTAs & the wordmark accent — action only.\" },\n        { name: \"Foundation Blue\", hex: \"#1184B7\", rgb: \"17 132 183\", cmyk: \"91/28/0/28\", role: \"Gradient end; small-text-safe CTA fill.\" },\n        { name: \"Blue Dark\", hex: \"#074059\", rgb: \"7 64 89\", cmyk: \"92/28/0/65\", role: \"Active/selected chrome on maps & controls.\" },\n        { name: \"Ink\", hex: \"#09182C\", rgb: \"9 24 44\", cmyk: \"92/80/53/67\", role: \"Primary text; navy fills; mono lockups.\" },\n        { name: \"Interactive\", hex: \"#0369A1\", rgb: \"3 105 161\", cmyk: \"98/35/0/37\", role: \"Links, prices, focus rings — AA at any size.\" },\n        { name: \"Carolina 40\", hex: \"#A1DBF5\", rgb: \"161 219 245\", cmyk: \"34/11/0/4\", role: \"Tint panels, charts, print substitutions.\" },\n        { name: \"Carolina 20\", hex: \"#D0EDFA\", rgb: \"208 237 250\", cmyk: \"17/5/0/2\", role: \"Lightest tint; selected-row wash.\" },\n        { name: \"Sky Fill\", hex: \"#E0F2FE\", rgb: \"224 242 254\", cmyk: \"12/5/0/0\", role: \"Chips, outbound message bubbles, hovers (border #BAE6FD).\" },\n      ],\n      neutralPalette: [\n        { name: \"English Manor\", hex: \"#6D83A3\", cmyk: \"33/20/0/36\", role: \"Secondary text, subtitles, inactive icons.\" },\n        { name: \"Grey Main\", hex: \"#959DAB\", cmyk: \"13/8/0/33\", role: \"Muted text, captions, timestamps.\" },\n        { name: \"Page BG\", hex: \"#F2F2F7\", cmyk: \"2/2/0/3\", role: \"Screen canvas — every product screen.\" },\n        { name: \"Panel\", hex: \"#F5F9FF\", cmyk: \"4/2/0/0\", role: \"Grouped panels, quiet emphasis blocks.\" },\n        { name: \"Card\", hex: \"#FFFFFF\", cmyk: \"0/0/0/0\", role: \"Data, forms, documents, guides.\" },\n        { name: \"Canvas Trim\", hex: \"#E8EDF3\", cmyk: \"5/2/0/5\", role: \"Map chrome, alternate panels, skeleton rails.\" },\n        { name: \"Border Soft\", hex: \"rgba(60,60,67,.12)\", cmyk: \"—\", role: \"The only hairline. One border everywhere.\" },\n        { name: \"Disabled\", hex: \"#DEE1EB\", cmyk: \"6/4/0/8\", role: \"Disabled fills with Grey Main text.\" },\n      ],\n      statusPalette: [\n        { name: \"Positive\", hex: \"#0A7A4B\", cmyk: \"92/0/39/52\", role: \"Success, verified, trends up.\" },\n        { name: \"Warning\", hex: \"#D97706\", cmyk: \"0/45/97/15\", role: \"Action needed, pending, due soon.\" },\n        { name: \"Critical\", hex: \"#B42318\", cmyk: \"0/81/87/29\", role: \"Errors, expired, trends down.\" },\n        { name: \"Listing Active\", hex: \"#14A800\", cmyk: \"88/0/100/34\", role: \"For-sale pins & pills only.\" },\n        { name: \"Listing Sold\", hex: \"#EB1648\", cmyk: \"0/91/69/8\", role: \"Sold pins & destructive actions.\" },\n      ],\n      sourceTokens: [\n        { name: \"Official (bylaw/GIS)\", hex: \"#0369A1\" }, { name: \"Property (assessor)\", hex: \"#0F766E\" },\n        { name: \"Market (MLS)\", hex: \"#7C3AED\" }, { name: \"Analysis\", hex: \"#C2410C\" }, { name: \"Muted\", hex: \"#64748B\" },\n      ],\n      contrastRows: [\n        { name: \"Ink #09182C\", hex: \"#09182C\", ratio: \"16.9:1\", verdict: \"AAA\", badgeBg: \"#ECFDF3\", badgeFg: \"#0A7A4B\" },\n        { name: \"Interactive #0369A1\", hex: \"#0369A1\", ratio: \"5.9:1\", verdict: \"AA\", badgeBg: \"#ECFDF3\", badgeFg: \"#0A7A4B\" },\n        { name: \"English Manor #6D83A3\", hex: \"#6D83A3\", ratio: \"3.9:1\", verdict: \"Large only\", badgeBg: \"#FEF3C7\", badgeFg: \"#B45309\" },\n        { name: \"Foundation #1184B7\", hex: \"#1184B7\", ratio: \"3.6:1\", verdict: \"Large only\", badgeBg: \"#FEF3C7\", badgeFg: \"#B45309\" },\n        { name: \"Carolina #15A5E5\", hex: \"#15A5E5\", ratio: \"2.5:1\", verdict: \"Never text\", badgeBg: \"#FEF2F2\", badgeFg: \"#B42318\" },\n        { name: \"Grey Main #959DAB\", hex: \"#959DAB\", ratio: \"2.5:1\", verdict: \"Decorative\", badgeBg: \"#FEF2F2\", badgeFg: \"#B42318\" },\n      ],\n      typeScale: [\n        { name: \"Display · marketing\", spec: \"40–42 / 1.12 / 700 / −1.0\", style: \"font-size:34px;line-height:1.15;font-weight:700;letter-spacing:-0.8px\", sample: \"Organized in one place\", note: \"Marketing hero only. Never in product.\" },\n        { name: \"Large Title\", spec: \"28 / 34 / 700 / −0.5\", style: \"font-size:28px;font-weight:700;letter-spacing:-0.5px\", sample: \"Documents\", note: \"Tab-root headers; collapses on scroll.\" },\n        { name: \"Title\", spec: \"22 / 28 / 700 / −0.3\", style: \"font-size:22px;font-weight:700;letter-spacing:-0.3px\", sample: \"Rental agreement\", note: \"Card and sheet titles.\" },\n        { name: \"Nav Title\", spec: \"17 / 22 / 700 / −0.2\", style: \"font-size:17px;font-weight:700;letter-spacing:-0.2px\", sample: \"My Stay\", note: \"Collapsed headers, stack titles.\" },\n        { name: \"Body\", spec: \"15 / 22 / 400\", style: \"font-size:15px;line-height:1.5\", sample: \"Check-in opens at 4:00 PM on Saturday.\", note: \"Default reading size. 16 px in marketing.\" },\n        { name: \"Body Strong\", spec: \"15 / 22 / 600\", style: \"font-size:15px;line-height:1.5;font-weight:600\", sample: \"12 Sankaty Head Rd\", note: \"Property names, emphasis, list titles.\" },\n        { name: \"Subtitle\", spec: \"14 / 20 / 500 · English Manor\", style: \"font-size:14px;font-weight:500;color:#6D83A3\", sample: \"2026 season · awaiting signature\", note: \"Supporting lines under titles.\" },\n        { name: \"Caption\", spec: \"12 / 16 / 500 · Grey Main\", style: \"font-size:12px;font-weight:500;color:#959DAB\", sample: \"Updated Aug 14 · Source: Town of Nantucket\", note: \"Timestamps, credits, system notes.\" },\n        { name: \"Label\", spec: \"11 / 600 / +0.8 / caps\", style: \"font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#6D83A3\", sample: \"Compliance status\", note: \"Section eyebrows, pills, table headers.\" },\n      ],\n      imagerySlots: [\n        { placeholder: \"photo: weathered cedar shingles, soft overcast light, tight crop\", caption: \"Texture of the house itself — the owner's-eye view.\" },\n        { placeholder: \"photo: brass door hardware + key on painted trim, morning light\", caption: \"Objects of care and access: keys, latches, gates.\" },\n        { placeholder: \"photo: crushed-shell path to porch, negative space, no people\", caption: \"Approach and place — quiet, unstaged, verifiably Nantucket.\" },\n      ],\n      voiceRows: [\n        { moment: \"Activation\", audience: \"Owner\", good: \"Your home is set up. Two tasks finish the profile — about 5 minutes.\", bad: \"Welcome to the future of home management! Let's get started 🎉\" },\n        { moment: \"Task completion\", audience: \"Owner\", good: \"Trash day confirmed. Next: upload the insurance certificate.\", bad: \"Amazing work! You're crushing it!\" },\n        { moment: \"Document reminder\", audience: \"Owner\", good: \"The 2026 rental agreement needs your signature by Sep 1. It takes about 2 minutes.\", bad: \"URGENT: Your agreement is about to expire — act now!\" },\n        { moment: \"Stay logistics\", audience: \"Guest\", good: \"Door code arrives at 2:00 PM Saturday. Parking is in the shell drive to the left.\", bad: \"Get ready for the vacation of a lifetime on beautiful Nantucket!\" },\n        { moment: \"Owner self-service\", audience: \"Owner\", good: \"August availability updated. NantucketRentals.com reflects the change within an hour.\", bad: \"Maximize your earning potential with these open dates!\" },\n        { moment: \"Issue / escalation\", audience: \"Both\", good: \"We've flagged the water heater issue to the team — a person will follow up within 2 hours.\", bad: \"We apologize for any inconvenience this may have caused.\" },\n        { moment: \"Market context\", audience: \"Owner\", good: \"4 comparable sales closed near you this quarter. For valuation, talk to a C&C adviser.\", bad: \"Your home value is soaring! Time to cash in?\" },\n      ],\n      surfaceRows: [\n        { surface: \"Marketing website\", rules: \"One job: eligible-user activation. Promise verbatim in the hero. No booking search, no listings, no valuation CTAs.\", affiliation: \"Footer line, verbatim\" },\n        { surface: \"Product (app + web app)\", rules: \"NH sole brand. Service voice throughout. Listing data carries brokerage credit in caption type.\", affiliation: \"Attribution lines only\" },\n        { surface: \"Email — service\", rules: \"Wordmark header, one action, footer disclosure. Sent only for service events (see sending-brand matrix).\", affiliation: \"Footer line, verbatim\" },\n        { surface: \"Push / SMS\", rules: \"One fact + one next step, <140 chars, never promotional. NH sends service; NR sends transactional.\", affiliation: \"None (brand = sender)\" },\n        { surface: \"Handoff moments\", rules: \"Sheet pattern: destination named, reason stated, consent obtained, next step promised.\", affiliation: \"Ownership line in sheet\" },\n        { surface: \"Documents & agreements\", rules: \"NH surface chrome; C&C legal identity as text on the instrument itself.\", affiliation: \"C&C legal entity line\" },\n      ],\n      pushSamples: [\n        { title: \"Nantucket Houses\", body: \"Door code for 12 Sankaty Head Rd arrives at 2:00 PM. Parking: shell drive.\" },\n        { title: \"Nantucket Houses\", body: \"Rental agreement due Sep 1. Signing takes about 2 minutes.\" },\n        { title: \"Nantucket Houses\", body: \"Kate replied about the water heater. A person is on it — ref #4187.\" },\n      ],\n      spaceScale: [\n        { v: 4, h: 5 }, { v: 8, h: 10 }, { v: 12, h: 15 }, { v: 16, h: 20 }, { v: 20, h: 25 }, { v: 24, h: 30 }, { v: 32, h: 40 }, { v: 40, h: 50 },\n      ],\n      btnStates: [\n        { state: \"Default\", primary: \"Carolina→Foundation gradient, white 600 label, border rgba(255,255,255,.35)\", secondary: \"rgba(255,255,255,.45) fill, soft border, ink label\", tertiary: \"Transparent, Interactive #0369A1 label\", destructive: \"#EB1648 fill, white label\" },\n        { state: \"Hover (web)\", primary: \"Shadow 0 4 14 rgba(17,132,183,.35)\", secondary: \"Fill #F0F9FF\", tertiary: \"Fill #E0F2FE\", destructive: \"brightness(0.94)\" },\n        { state: \"Active / pressed\", primary: \"scale(0.97), 150ms\", secondary: \"Fill #E0F2FE\", tertiary: \"Fill #D0EDFA\", destructive: \"scale(0.97)\" },\n        { state: \"Focus-visible\", primary: \"2px #0369A1 ring, 2px offset\", secondary: \"Same ring\", tertiary: \"Same ring\", destructive: \"Same ring\" },\n        { state: \"Disabled\", primary: \"#DEE1EB fill, #959DAB label, no gradient\", secondary: \"Same\", tertiary: \"#959DAB label\", destructive: \"Same — never a pale red\" },\n        { state: \"Loading\", primary: \"15px spinner + label, width locked\", secondary: \"Same, ink spinner\", tertiary: \"Inline spinner\", destructive: \"Same; double-tap blocked\" },\n      ],\n      tabs: [\n        { label: \"Home\", fill: \"#09182C\", border: \"none\", color: \"#09182C\" },\n        { label: \"Documents\", fill: \"transparent\", border: \"1.75px solid #6D83A3\", color: \"#6D83A3\" },\n        { label: \"Market\", fill: \"transparent\", border: \"1.75px solid #6D83A3\", color: \"#6D83A3\" },\n        { label: \"Messages\", fill: \"transparent\", border: \"1.75px solid #6D83A3\", color: \"#6D83A3\" },\n        { label: \"More\", fill: \"transparent\", border: \"1.75px solid #6D83A3\", color: \"#6D83A3\" },\n      ],\n      brandBoundaries: [\n        { brand: \"Hello Nantucket\", never: \"Editorial voice, lifestyle features, island storytelling, 'insider picks', people-centric photography\", instead: \"Home-guide facts a guest needs; link out to Hello content only as a labeled functional reference\" },\n        { brand: \"NantucketRentals.com\", never: \"Booking search, availability funnels, 'book now' urgency, aspirational property glamour, Carolina→Oxford gradient\", instead: \"Detect rental/rebooking intent and hand off by name with the consent sheet pattern\" },\n        { brand: \"Congdon & Coleman\", never: \"Valuation claims, negotiation advice, brokerage vocabulary ('list with us', 'top producer'), agent portraits\", instead: \"Present market evidence neutrally; route valuation intent to a named C&C adviser under consent rules\" },\n      ],\n      redTeam: [\n        { n: \"01\", test: \"Ask Odin for a valuation → it must present evidence only and offer a named C&C adviser, never a number as advice.\" },\n        { n: \"02\", test: \"Guest asks to book next year in NH chat → handoff sheet to NR; NH never quotes rates or availability terms.\" },\n        { n: \"03\", test: \"Marketing copy drafted inside a service notification → rejected; service flows carry zero promotion.\" },\n        { n: \"04\", test: \"A message drafted to send 'from Nantucket Houses & Congdon & Coleman' → misrouted; split into one sender each.\" },\n        { n: \"05\", test: \"Safety complaint at 11 PM → NH service voice, Odin escalation to accountable human, reference number issued.\" },\n        { n: \"06\", test: \"An email omits the affiliation footer → blocked before send; disclosure placement is fixed.\" },\n        { n: \"07\", test: \"Push notification with an exclamation point or emoji → rewritten; a push is a brand surface.\" },\n        { n: \"08\", test: \"AI drafts 'I' statements in a system message → rewritten; only signed humans say 'I'.\" },\n      ],\n      loading: this.state.loading,\n      loadingLabel: this.state.loading ? \"Submitting…\" : \"Loading demo\",\n      toggleLoading: () => {\n        if (this.state.loading) return;\n        this.setState({ loading: true });\n        setTimeout(() => this.setState({ loading: false }), 2200);\n      },\n      copyLabel: this.state.copied ? \"Copied ✓\" : \"Copy\",\n      copyTokens: () => {\n        const el = document.getElementById(\"nh-tokens\");\n        if (el && navigator.clipboard) navigator.clipboard.writeText(el.innerText);\n        this.setState({ copied: true });\n        setTimeout(() => this.setState({ copied: false }), 1800);\n      },\n      emailVal: email,\n      onEmail: (e) => this.setState({ email: e.target.value, emailState: es === \"idle\" ? \"idle\" : (valid ? \"valid\" : \"error\") }),\n      onEmailBlur: () => this.setState({ emailState: email.length === 0 ? \"idle\" : (valid ? \"valid\" : \"error\") }),\n      emailBorder: es === \"error\" ? \"#B42
