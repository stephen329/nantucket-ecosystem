lder-count=\"11\">\n      <a href=\"#{{ n.id }}\" style=\"display:flex;gap:10px;align-items:baseline;padding:7px 10px;border-radius:8px;font-size:12.5px;font-weight:500;color:#09182C;text-decoration:none\" style-hover=\"background:#E0F2FE;text-decoration:none\"><span style=\"font-size:10px;font-weight:600;color:#15A5E5;font-variant-numeric:tabular-nums\">{{ n.num }}<\u002Fspan>{{ n.label }}<\u002Fa>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"margin-top:26px;padding:12px;border-radius:12px;background:#F5F9FF;font-size:11px;line-height:1.5;color:#6D83A3\">Approval path: <strong style=\"color:#09182C\">Stephen approves all deviations.<\u002Fstrong> Nothing here is optional for customer-facing surfaces.<\u002Fdiv>\n<\u002Fnav>\n<main style=\"flex:1;min-width:0;max-width:1040px;padding:44px 52px 140px;box-sizing:border-box\">\n\n  <header style=\"margin-bottom:64px\">\n    <div style=\"font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#0369A1;margin-bottom:14px\">Nantucket Ecosystem · Product Brand<\u002Fdiv>\n    <h1 style=\"margin:0;font-size:42px;line-height:1.12;font-weight:700;letter-spacing:-1px\">Nantucket Houses<br>Brand Guidelines<\u002Fh1>\n    <p style=\"margin:20px 0 0;max-width:640px;font-size:16px;line-height:1.65;color:rgba(9,24,44,0.8)\">The organizing utility layer of the Nantucket house of brands. This revision preserves the equity of the current identity, tightens it into an implementable system, and draws hard boundaries against Hello Nantucket, NantucketRentals.com, and Congdon &amp; Coleman. Every value in this guide is sourced from the live platform codebase (<code style=\"font-family:ui-monospace,Menlo,monospace;font-size:13px;background:#E0F2FE;padding:1px 5px;border-radius:4px\">brand-tokens.ts<\u002Fcode>, <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:13px;background:#E0F2FE;padding:1px 5px;border-radius:4px\">glassTheme.ts<\u002Fcode>) or explicitly marked as new.<\u002Fp>\n    <div style=\"display:flex;gap:10px;margin-top:22px;flex-wrap:wrap\">\n      <span style=\"font-size:11.5px;font-weight:600;padding:6px 12px;border-radius:999px;background:#09182C;color:#fff\">Promise: “Your Nantucket home and stay, organized in one place.”<\u002Fspan>\n      <span style=\"font-size:11.5px;font-weight:500;padding:6px 12px;border-radius:999px;background:#E0F2FE;color:#0369A1;border:1px solid #BAE6FD\">KPI: eligible-user activation + core-task completion<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <section id=\"s1\" data-screen-label=\"01 Brand platform\" style=\"scroll-margin-top:24px;margin-bottom:60px\">\n    <div style=\"font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#15A5E5;margin-bottom:6px\">Section 01<\u002Fdiv>\n    <h2 style=\"margin:0 0 18px;font-size:27px;font-weight:700;letter-spacing:-0.5px\">Brand platform<\u002Fh2>\n    <div style=\"background:#fff;border-radius:12px;padding:26px 30px;border:1px solid rgba(60,60,67,0.12);margin-bottom:16px\">\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:26px\">\n        <div>\n          <div style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#6D83A3;margin-bottom:8px\">Role in the ecosystem<\u002Fdiv>\n          <p style=\"margin:0;font-size:14px;line-height:1.65;color:rgba(9,24,44,0.85)\">Nantucket Houses maintains <strong>useful continuity between transactions<\u002Fstrong> for eligible C&amp;C/NR homeowners and booked guests. Hello earns attention; NR converts rental intent; C&amp;C supplies licensed judgment; Odin orchestrates internally. NH is the place where the home and the stay are organized — nothing more, and deliberately nothing less.<\u002Fp>\n          <div style=\"margin-top:14px;font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#6D83A3;margin-bottom:8px\">Promise — exact wording<\u002Fdiv>\n          <p style=\"margin:0;font-size:16px;font-weight:600;line-height:1.5\">“Your Nantucket home and stay, organized in one place.”<\u002Fp>\n          <p style=\"margin:8px 0 0;font-size:12.5px;line-height:1.6;color:#6D83A3\">This sentence is fixed. It appears verbatim on the marketing homepage, the App Store subtitle region, and activation emails. Do not paraphrase it into lifestyle or sales language.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#6D83A3;margin-bottom:8px\">Personality<\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px\">\n            <sc-for list=\"{{ personality }}\" as=\"p\" hint-placeholder-count=\"6\"><span style=\"font-size:12px;font-weight:500;padding:5px 11px;border-radius:999px;background:#F5F9FF;border:1px solid rgba(60,60,67,0.12)\">{{ p }}<\u002Fspan><\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#6D83A3;margin-bottom:8px\">Positioning resolution<\u002Fdiv>\n          <p style=\"margin:0;font-size:13px;line-height:1.65;color:rgba(9,24,44,0.85)\">The shipped app leads with property intelligence (MLS, comps, zoning). The strategy leads with organizing utility. This guide resolves the tension deliberately: <strong>intelligence is an owner-facing capability inside the organizing role<\u002Fstrong>. Market data appears as evidence in service of an owner's decisions about their home — never as a discovery funnel, never as counsel. Counsel belongs to a named C&amp;C adviser.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px\">\n      <div style=\"background:#fff;border-radius:12px;padding:22px 26px;border:1px solid rgba(60,60,67,0.12)\">\n        <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:8px\"><span style=\"width:8px;height:8px;border-radius:2px;background:#074059\"><\u002Fspan><span style=\"font-size:13px;font-weight:600\">Homeowners<\u002Fspan><span style=\"font-size:10px;font-weight:600;letter-spacing:0.6px;text-transform:uppercase;color:#0369A1;background:#E0F2FE;padding:2px 7px;border-radius:4px\">Owner<\u002Fspan><\u002Fdiv>\n        <p style=\"margin:0;font-size:13px;line-height:1.6;color:rgba(9,24,44,0.85)\">Eligible C&amp;C/NR owners. Jobs: home operations, documents and agreements, compliance status, availability, owner statements context, market evidence about <em>their<\u002Fem> parcel. Tone: peer-professional, evidence-first.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border-radius:12px;padding:22px 26px;border:1px solid rgba(60,60,67,0.12)\">\n        <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:8px\"><span style=\"width:8px;height:8px;border-radius:2px;background:#15A5E5\"><\u002Fspan><span style=\"font-size:13px;font-weight:600\">Booked guests<\u002Fspan><span style=\"font-size:10px;font-weight:600;letter-spacing:0.6px;text-transform:uppercase;color:#0F766E;background:#F0FDF9;padding:2px 7px;border-radius:4px\">Guest<\u002Fspan><\u002Fdiv>\n        <p style=\"margin:0;font-size:13px;line-height:1.6;color:rgba(9,24,44,0.85)\">Guests with a confirmed booking. Jobs: check-in logistics, the home guide, in-stay messages, issue reporting. Tone: concierge-calm, zero selling. Rebooking intent is detected and handed to NantucketRentals.com — NH never runs the funnel.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#09182C;border-radius:12px;padding:22px 28px;color:#fff\">\n      <div style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#A1DBF5;margin-bottom:12px\">House of brands — one job each<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:14px\">\n        <sc-for list=\"{{ ecosystem }}\" as=\"b\" hint-placeholder-count=\"5\">\n          <div style=\"border-left:2px solid {{ b.color }};padding-left:12px\">\n            <div style=\"font-size:12.5px;font-weight:600;line-height:1.3\">{{ b.name }}<\u002Fdiv>\n            <div style=\"font-size:11px;line-height:1.5;color:rgba(255,255,255,0.65);margin-top:4px\">{{ b.job }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <p style=\"margin:16px 0 0;font-size:12px;line-height:1.6;color:rgba(255,255,255,0.75)\">Brands remain visually and verbally distinct. Common ownership and commercial relationships are <strong>never concealed<\u002Fstrong>. The customer must always understand who is communicating, why their information is used, and what happens next.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"s2\" data-screen-label=\"02 Logo system\" style=\"scroll-margin-top:24px;margin-bottom:60px\">\n    <div style=\"font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#15A5E5;margin-bottom:6px\">Section 02<\u002Fdiv>\n    <h2 style=\"margin:0 0 6px;font-size:27px;font-weight:700;letter-spacing:-0.5px\">Logo system<\u002Fh2>\n    <p style=\"margin:0 0 18px;max-width:640px;font-size:13.5px;line-height:1.65;color:rgba(9,24,44,0.75)\"><strong>Retained:<\u002Fstrong> the house-A wordmark and the island-in-house app icon — both carry existing recognition. <strong>Refined:<\u002Fstrong> clear space, minimum sizes, a monogram, mono versions, and a new .COM rule. Ecosystem-driven decision: the house-A motif is shared visual DNA with NantucketRentals; NH keeps it but separates through color balance (navy-dominant, single Carolina element) and context rules below.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:16px\">\n      <div style=\"background:#fff;border-radius:12px;padding:28px 30px;border:1px solid rgba(60,60,67,0.12)\">\n        <div style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#6D83A3;margin-bottom:16px\">Primary lockup — marketing web<\u002Fdiv>\n        <div style=\"background:#F5F9FF;border-radius:8px;padding:36px;display:flex;justify-content:center\"><img src=\"251a65ee-1df5-4a5b-913f-ecb44cf61cd2\" alt=\"Nantucket Houses primary lockup\" style=\"width:260px\"><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:18px\">\n          <div><div style=\"font-size:10.5px;font-weight:600;letter-spacing:0.6px;text-transform:uppercase;color:#6D83A3\">Clear space<\u002Fdiv><div style=\"font-size:13px;font-weight:500;margin-top:3px\">1× on all sides<\u002Fdiv><div style=\"font-size:11px;color:#6D83A3;margin-top:2px\">x = height of the house-A glyph<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-size:10.5px;font-weight:600;letter-spacing:0.6px;text-transform:uppercase;color:#6D83A3\">Min size · screen<\u002Fdiv><div style=\"font-size:13px;font-weight:500;margin-top:3px\">140 px wide<\u002Fdiv><div style=\"font-size:11px;color:#6D83A3;margin-top:2px\">below that, use the monogram<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-size:10.5px;font-weight:600;letter-spacing:0.6px;text-transform:uppercase;color:#6D83A3\">Min size · print<\u002Fdiv><div style=\"font-size:13px;font-weight:500;margin-top:3px\">1.25 in wide<\u002Fdiv><div style=\"font-size:11px;color:#6D83A3;margin-top:2px\">0.75 in for the monogram<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:16px\">\n        <div style=\"background:#fff;border-radius:12px;padding:22px 24px;border:1px solid rgba(60,60,67,0.12);flex:1\">\n          <div style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#6D83A3;margin-bottom:12px\">App icon<\u002Fdiv>\n          <div style=\"display:flex;gap:16px;align-items:center\">\n            <img src=\"48418c60-87b0-4acb-8ca2-d2f04be0f362\" alt=\"Nantucket Houses app icon\" style=\"width:76px;border-radius:17px;box-shadow:0 2px 8px rgba(9,24,44,0.15)\">\n            <p style=\"margin:0;font-size:12px;line-height:1.6;color:rgba(9,24,44,0.8)\">Island-in-house, solid navy on white. Never place the icon inside marketing layouts as a logo substitute — it is an OS surface mark.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border-radius:12px;padding:22px 24px;border:1px solid rgba(60,60,67,0.12);flex:1\">\n          <div style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#6D83A3;margin-bottom:12px\">Monogram — new<\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:center\">\n            <span style=\"width:44px;height:44px;border-radius:10px;background:#09182C;display:inline-flex;align-items:center;justify-content:center\"><span style=\"display:block;width:20px;height:18px;background:#15A5E5;clip-path:polygon(50% 0,100% 42%,100% 100%,72% 100%,72% 55%,28% 55%,28% 100%,0 100%,0 42%)\"><\u002Fspan><\u002Fspan>\n            <span style=\"width:44px;height:44px;border-radius:10px;background:#fff;border:1px solid rgba(60,60,67,0.12);display:inline-flex;align-items:center;justify-content:center\"><span style=\"display:block;width:20px;height:18px;background:#09182C;clip-path:polygon(50% 0,100% 42%,100% 100%,72% 100%,72% 55%,28% 55%,28% 100%,0 100%,0 42%)\"><\u002Fspan><\u002Fspan>\n            <p style=\"margin:0;font-size:12px;line-height:1.6;color:rgba(9,24,44,0.8)\">The house-A glyph alone, for favicons, avatars, and lockups under 140 px. Carolina on navy, or navy on white. Never both blues in the glyph.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px\">\n      <div style=\"background:#fff;border-radius:12px;padding:22px 26px;border:1px solid rgba(60,60,67,0.12)\">\n        <div style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#6D83A3;margin-bottom:10px\">.COM rule — new<\u002Fdiv>\n        <ul style=\"margin:0;padding-left:18px;font-size:13px;line-height:1.75;color:rgba(9,24,44,0.85)\">\n          <li><strong>Marketing web keeps “.COM”<\u002Fstrong> — it states where you are.<\u002Fli>\n          <li><strong>App and product surfaces drop it.<\u002Fstrong> In-product headers, splash, notifications, and documents use the wordmark without “.COM” (or the monogram). A product you are already inside does not advertise its URL.<\u002Fli>\n          <li>Never typeset “.com” manually next to the wordmark; use the approved lockup files only.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border-radius:12px;padding:22px 26px;border:1px solid rgba(60,60,67,0.12)\">\n        <div style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#6D83A3;margin-bottom:10px\">Mono versions<\u002Fdiv>\n        <div style=\"display:flex;gap:10px;margin-bottom:10px\">\n          <span style=\"flex:1;background:#09182C;border-radius:8px;padding:14px;display:flex;justify-content:center;align-items:center;font-size:13px;font-weight:700;letter-spacing:0.5px;color:#fff\">ALL-WHITE<\u002Fspan>\n          <span style=\"flex:1;background:#F5F9FF;border:1px solid rgba(60,60,67,0.12);border-radius:8px;padding:14px;display:flex;justify-content:center;align-items:center;font-size:13px;font-weight:700;letter-spacing:0.5px;color:#09182C\">ALL-NAVY<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:12px;line-height:1.6;color:rgba(9,24,44,0.8)\">On photography, navy fills, or single-color print: all-white or all-navy (#09182C) versions with the house-A in the same ink. The two-color version only appears on white or panel (#F5F9FF) backgrounds.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border-radius:12px;padding:22px 26px;border:1px solid rgba(60,60,67,0.12);margin-bottom:16px\">\n      <div style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#6D83A3;margin-bottom:12px\">Incorrect usage<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:10px\">\n        <sc-for list=\"{{ logoDonts }}\" as=\"d\" hint-placeholder-count=\"6\">\n          <div style=\"display:flex;gap:8px;align-items:baseline;font-size:12.5px;line-height:1.5;color:rgba(9,24,44,0.85)\"><span style=\"color:#B42318;font-weight:700\">✕<\u002Fspan>{{ d }}<\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border-radius:12px;padding:22px 26px;border:1px solid rgba(60,60,67,0.12);margin-bottom:16px\">\n      <div style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#6D83A3;margin-bottom:10px\">Endorsement &amp; affiliation in lockups<\u002Fdiv>\n      <ul style=\"margin:0;padding-left:18px;font-size:13px;line-height:1.8;color:rgba(9,24,44,0.85)\">\n        <li>No co-branded lockups. NH never sits inside a shared logo strip with Hello, NR, or C&amp;C on consumer marketing.<\u002Fli>\n        <li>Affiliation is typeset, not drawn: a functional footer credit in body type (see <a href=\"#s6\">Voice<\u002Fa> for canonical strings). Legal documents carry C&amp;C legal identity as text regardless of the surface that produced them.<\u002Fli>\n        <li>Listing attribution inside NH product uses the brokerage credit line in caption type — never the NR or C&amp;C logo inline with content.<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <sc-if value=\"{{ showConcepts }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"background:#F5F9FF;border:1px dashed #BAE6FD;border-radius:12px;padding:22px 26px\">\n      <div style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#0369A1;margin-bottom:12px\">Exploratory — not yet approved<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px\">\n        <div>\n          <div style=\"font-size:13px;font-weight:600;margin-bottom:6px\">Direction A · Island mark promotion<\u002Fdiv>\n          <p style=\"margin:0 0 10px;font-size:12.5px;line-height:1.6;color:rgba(9,24,44,0.8)\">Evolve the island-in-house app icon into the primary brand mark: island silhouette knocked out of a navy house, paired left of the wordmark. Strength: NH gains a mark NR does not share. Requires redrawing the island at small sizes.<\u002Fp>\n          <div style=\"display:flex;gap:10px;align-items:center\"><img src=\"48418c60-87b0-4acb-8ca2-d2f04be0f362\" style=\"width:44px;border-radius:10px\" alt=\"island mark\"><span style=\"font-size:15px;font-weight:700;letter-spacing:0.5px\">NANTUCKET HOUSES<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:13px;font-weight:600;margin-bottom:6px\">Direction B · House-A regeometry<\u002Fdiv>\n          <p style=\"margin:0 0 10px;font-size:12.5px;line-height:1.6;color:rgba(9,24,44,0.8)\">Keep the house-A but shift the balance: navy glyph with a single Carolina door/keyline detail instead of a fully Carolina glyph — quieter, more “utility” than NR's marketing-bright version.<\u002Fp>\n          <div style=\"display:flex;gap:10px;align-items:center\"><span style=\"display:block;width:26px;height:24px;background:#09182C;clip-path:polygon(50% 0,100% 42%,100% 100%,72% 100%,72% 55%,28% 55%,28% 100%,0 100%,0 42%)\"><\u002Fspan><span style=\"display:block;width:8px;height:11px;background:#15A5E5;border-radius:2px;margin-left:-21px;margin-top:10px\"><\u002Fspan><span style=\"font-size:15px;font-weight:700;letter-spacing:0.5px;margin-left:14px\">NANTUCKET HOUSES<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:14px 0 0;font-size:11.5px;color:#6D83A3\">Either direction ships only with Stephen's approval and a full redraw by a mark designer. Until then, the current lockup governs.<\u002Fp>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fsection>\n\n  <section id=\"s3\" data-screen-label=\"03 Color system\" style=\"scroll-margin-top:24px;margin-bottom:60px\">\n    <div style=\"font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#15A5E5;margin-bottom:6px\">Section 03<\u002Fdiv>\n    <h2 style=\"margin:0 0 6px;font-size:27px;font-weight:700;letter-spacing:-0.5px\">Color system<\u002Fh2>\n    <p style=\"margin:0 0 18px;max-width:660px;font-size:13.5px;line-height:1.65;color:rgba(9,24,44,0.75)\"><strong>Retained:<\u002Fstrong> the full platform palette from <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:12px;background:#E0F2FE;padding:1px 5px;border-radius:4px\">brand-tokens.ts<\u002Fcode> — Carolina Blue stays primary; family resemblance with NR is accepted and managed through usage hierarchy, not hue change. <strong>The rule that separates NH from every sibling: color signals function, never decoration.<\u002Fstrong><\u002Fp>\n    <div style=\"font-size:12px;font-weight:600;letter-spacing:0.6px;text-transform:uppercase;color:#6D83A3;margin-bottom:10px\">Brand &amp; interactive<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px\">\n      <sc-for list=\"{{ corePalette }}\" as=\"c\" hint-placeholder-count=\"8\">\n        <div style=\"background:#fff;border-radius:12px;border:1px solid rgba(60,60,67,0.12);overflow:hidden\">\n          <div style=\"height:58px;background:{{ c.hex }}\"><\u002Fdiv>\n          <div style=\"padding:10px 12px\">\n            <div style=\"font-size:12.5px;font-weight:600\">{{ c.name }}<\u002Fdiv>\n            <div style=\"font-size:10.5px;font-family:ui-monospace,Menlo,monospace;color:#6D83A3;margin-top:3px\">{{ c.hex }} · {{ c.rgb }}<\u002Fdiv>\n            <div style=\"font-size:10.5px;font-family:ui-monospace,Menlo,monospace;color:#6D83A3\">CMYK {{ c.cmyk }}<\u002Fdiv>\n            <div style=\"font-size:11px;line-height:1.45;color:rgba(9,24,44,0.75);margin-top:5px\">{{ c.role }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"font-size:12px;font-weight:600;letter-spacing:0.6px;text-transform:uppercase;color:#6D83A3;margin-bottom:10px\">Neutrals &amp; surfaces<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px\">\n      <sc-for list=\"{{ neutralPalette }}\" as=\"c\" hint-placeholder-count=\"8\">\n        <div style=\"background:#fff;border-radius:12px;border:1px solid rgba(60,60,67,0.12);overflow:hidden\">\n          <div style=\"height:44px;background:{{ c.hex }};border-bottom:1px solid rgba(60,60,67,0.08)\"><\u002Fdiv>\n          <div style=\"padding:10px 12px\">\n            <div style=\"font-size:12.5px;font-weight:600\">{{ c.name }}<\u002Fdiv>\n            <div style=\"font-size:10.5px;font-family:ui-monospace,Menlo,monospace;color:#6D83A3;margin-top:3px\">{{ c.hex }} · CMYK {{ c.cmyk }}<\u002Fdiv>\n            <div style=\"font-size:11px;line-height:1.45;color:rgba(9,24,44,0.75);margin-top:5px\">{{ c.role }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"font-size:12px;font-weight:600;letter-spacing:0.6px;text-transform:uppercase;color:#6D83A3;margin-bottom:10px\">Status — success / warning / error only<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px\">\n      <sc-for list=\"{{ statusPalette }}\" as=\"c\" hint-placeholder-count=\"5\">\n        <div style=\"background:#fff;border-radius:12px;border:1px solid rgba(60,60,67,0.12);overflow:hidden\">\n          <div style=\"height:44px;background:{{ c.hex }}\"><\u002Fdiv>\n          <div style=\"padding:10px 12px\">\n            <div style=\"font-size:12.5px;font-weight:600\">{{ c.name }}<\u002Fdiv>\n            <div style=\"font-size:10.5px;font-family:ui-monospace,Menlo,monospace;color:#6D83A3;margin-top:3px\">{{ c.hex }} · CMYK {{ c.cmyk }}<\u002Fdiv>\n            <div style=\"font-size:11px;line-height:1.45;color:rgba(9,24,44,0.75);margin-top:5px\">{{ c.role }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"font-size:12px;font-weight:600;letter-spacing:0.6px;text-transform:uppercase;color:#6D83A3;margin-bottom:10px\">Evidence provenance — never mapped to status<\u002Fdiv>\n    <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px\">\n      <sc-for list=\"{{ sourceTokens }}\" as=\"s\" hint-placeholder-count=\"5\">\n        <span style=\"display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:500;padding:6px 12px;border-radius:999px;background:#fff;border:1px solid rgba(60,60,67,0.12)\"><span style=\"width:9px;height:9px;border-radius:999px;background:{{ s.hex }}\"><\u002Fspan>{{ s.name }} <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:#6D83A3\">{{ s.hex }}<\u002Fspan><\u002Fspan>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1.15fr 1fr;gap:16px\">\n      <div style=\"background:#fff;border-radius:12px;padding:22px 26px;border:1px solid rgba(60,60,67,0.12)\">\n        <div style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#6D83A3;margin-bottom:10px\">Usage hierarchy<\u002Fdiv>\n        <ul style=\"margin:0;padding-left:18px;font-size:13px;line-height:1.8;color:rgba(9,24,44,0.85)\">\n          <li><strong>~90% of any screen is neutral<\u002Fstrong>: Page BG, Panel, white cards, ink text. Calm competence is a color budget, not a mood.<\u002Fli>\n          <li><strong>Carolina Blue = action.<\u002Fstrong> Primary CTAs (Carolina→Foundation gradient), active tab tint, the single accent in the wordmark. If it isn't tappable or the brand mark, it isn't Carolina.<\u002Fli>\n          <li><strong>Interactive #0369A1 = links, prices, selected text accents<\u002Fstrong> — the small-text-safe blue.<\u002Fli>\n          <li><strong>Status colors only report state<\u002Fstrong>; provenance colors only report source. Never decorate with either.<\u002Fli>\n          <li>NH gradient is Carolina→Foundation (within-blue, light). NR's brand gradient is Carolina→Oxford. Never use the NR gradient on any NH surface.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border-radius:12px;padding:22px 26px;border:1px solid rgba(60,60,67,0.12)\">\n        <div style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#6D83A3;margin-bottom:10px\">Accessibility — contrast on white<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:7px\">\n          <sc-for list=\"{{ contrastRows }}\" as=\"r\" hint-placeholder-count=\"6\">\n            <div style=\"display:flex;align-items:center;gap:10px;font-size:12px\">\n              <span style=\"width:14px;height:14px;border-radius:4px;background:{{ r.hex }};flex:none\"><\u002Fspan>\n              <span style=\"flex:1;font-weight:500\">{{ r.name }}<\u002Fspan>\n              <span style=\"font-family:ui-monospace,Menlo,monospace;color:#6D83A3\">{{ r.ratio }}<\u002Fspan>\n              <span style=\"font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:4px;background:{{ r.badgeBg }};color:{{ r.badgeFg }}\">{{ r.verdict }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"margin:12px 0 0;font-size:11.5px;line-height:1.6;color:#6D83A3\">Carolina Blue fails as text on white — reserve it for fills and large graphics. Small interactive text uses #0369A1. White CTA labels ride the gradient at ≥15 px semibold; below that use Foundation Blue fills. Print: run navy-heavy; Carolina tints (20/40%) for panels.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"s4\" data-screen-label=\"04 Typography\" style=\"scroll-margin-top:24px;margin-bottom:60px\">\n    <div style=\"font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#15A5E5;margin-bottom:6px\">Section 04<\u002Fdiv>\n    <h2 style=\"margin:0 0 6px;font-size:27px;font-weight:700;letter-spacing:-0.5px\">Typography<\u002Fh2>\n    <p style=\"margin:0 0 18px;max-width:660px;font-size:13.5px;line-height:1.65;color:rgba(9,24,44,0.75)\"><strong>Decision: Poppins everywhere.<\u002Fstrong> One face across marketing and product for maximum coherence (overlap with NR accepted; separation is carried by color budget and voice). Stack: <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:12px;background:#E0F2FE;padding:1px 5px;border-radius:4px\">'Poppins', -apple-system, system-ui, sans-serif<\u002Fcode>. Weights 400 / 500 / 600 / 700 only. Native app may fall back to the system face where Poppins is impractical (OS surfaces, long-form legal text) — the ladder below still governs sizes.<\u002Fp>\n    <div style=\"background:#fff;border-radius:12px;border:1px solid rgba(60,60,67,0.12);padding:8px 26px;margin-bottom:16px\">\n      <sc-for list=\"{{ typeScale }}\" as=\"t\" hint-placeholder-count=\"9\">\n        <div style=\"display:grid;grid-template-columns:170px 1fr 230px;gap:18px;align-items:baseline;padding:13px 0;border-bottom:1px solid rgba(60,60,67,0.08)\">\n          <div><div style=\"font-size:12px;font-weight:600\">{{ t.name }}<\u002Fdiv><div style=\"font-size:10.5px;font-family:ui-monospace,Menlo,monospace;color:#6D83A3;margin-top:2px\">{{ t.spec }}<\u002Fdiv><\u002Fdiv>\n          <div style=\"{{ t.style }}\">{{ t.sample }}<\u002Fdiv>\n          <div style=\"font-size:11px;line-height:1.5;color:#6D83A3\">{{ t.note }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n      <div style=\"background:#fff;border-radius:12px;padding:22px 26px;border:1px solid rgba(60,60,67,0.12)\">\n        <div style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#6D83A3;margin-bottom:10px\">Special treatments<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px;font-size:13px;line-height:1.6;color:rgba(9,24,44,0.85)\">\n          <div><strong>Property names<\u002Fstrong> — Body Strong (15/600), title case, never all-caps, never Carolina. <span style=\"font-weight:600\">12 Sankaty Head Rd<\u002Fspan><\u002Fdiv>\n          <div><strong>Status labels<\u002Fstrong> — Label style (11/600, caps, +0.8 tracking) in the status or provenance color's pill, never free-floating colored text. <span style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#0A7A4B;background:#ECFDF3;padding:2px 8px;border-radius:4px\">Verified<\u002Fspan><\u002Fdiv>\n          <div><strong>Dates &amp; numbers<\u002Fstrong> — tabular numerals (<code style=\"font-family:ui-monospace,Menlo,monospace;font-size:11.5px\">font-variant-numeric: tabular-nums<\u002Fcode>) in any column or list. Format: “Wed, Aug 14” · “Aug 14–21” · “Due Sep 1”. Never relative-only for deadlines.<\u002Fdiv>\n          <div><strong>System messages<\u002Fstrong> — Caption (12/500) in English Manor, never bold, never colored red unless the message is an error state.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border-radius:12px;padding:22px 26px;border:1px solid rgba(60,60,67,0.12)\">\n        <div style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#6D83A3;margin-bottom:10px\">Rules<\u002Fdiv>\n        <ul style=\"margin:0;padding-left:18px;font-size:13px;line-height:1.8;color:rgba(9,24,44,0.85)\">\n          <li>Marketing display type caps at 42 px — NH headlines inform, they don't shout.<\u002Fli>\n          <li>Body text is 15 px in product, 15–16 px in marketing; never below 12 px anywhere, 12 pt minimum in print.<\u002Fli>\n          <li>Negative tracking only at 22 px and above (−0.3 to −0.5); labels get +0.8.<\u002Fli>\n          <li>No italics in product UI. Emphasis = weight 600, one level only.<\u002Fli>\n          <li>Exo (NR's secondary face) is retired from all NH surfaces.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"s5\" data-screen-label=\"05 Imagery and iconography\" style=\"scroll-margin-top:24px;margin-bottom:60px\">\n    <div style=\"font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#15A5E5;margin-bottom:6px\">Section 05<\u002Fdiv>\n    <h2 style=\"margin:0 0 6px;font-size:27px;font-weight:700;letter-spacing:-0.5px\">Imagery, illustration &amp; iconography<\u002Fh2>\n    <p style=\"margin:0 0 18px;max-width:660px;font-size:13.5px;line-height:1.65;color:rgba(9,24,44,0.75)\">Direction: <strong>quiet island detail<\u002Fstrong>. NH photography looks at the home the way its owner does — close, familiar, unstaged. Hello owns editorial lifestyle; NR owns aspirational full-property glamour; C&amp;C owns portraiture and market authority. NH owns the detail shot.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px\">\n      <sc-for list=\"{{ imagerySlots }}\" as=\"im\" hint-placeholder-count=\"3\">\n        <div style=\"border-radius:12px;overflow:hidden;border:1px solid rgba(60,60,67,0.12);background:repeating-linear-gradient(45deg,#E8EDF3,#E8EDF3 10px,#F2F2F7 10px,#F2F2F7 20px)\">\n          <div style=\"height:150px;display:flex;align-items:center;justify-content:center;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#6D83A3;text-align:center;padding:0 16px\">{{ im.placeholder }}<\u002Fdiv>\n          <div style=\"background:#fff;padding:10px 14px;font-size:11.5px;line-height:1.5;color:rgba(9,24,44,0.8)\">{{ im.caption }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px\">\n      <div style=\"background:#fff;border-radius:12px;padding:22px 26px;border:1px solid rgba(60,60,67,0.12)\">\n        <div style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#0A7A4B;margin-bottom:10px\">Do<\u002Fdiv>\n        <ul style=\"margin:0;padding-left:18px;font-size:13px;line-height:1.8;color:rgba(9,24,44,0.85)\">\n          <li>Natural, overcast or early-morning light; soft shadows<\u002Fli>\n          <li>Close and mid-range: shingles, hardware, gates, paths, porches, keys, linens<\u002Fli>\n          <li>Generous negative space; one subject per frame<\u002Fli>\n          <li>Post: gentle lift, slightly reduced saturation, true grays — no filters, no HDR<\u002Fli>\n          <li>Photos appear only where they function (home guide covers, property headers)<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border-radius:12px;padding:22px 26px;border:1px solid rgba(60,60,67,0.12)\">\n        <div style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#B42318;margin-bottom:10px\">Don't<\u002Fdiv>\n        <ul style=\"margin:0;padding-left:18px;font-size:13px;line-height:1.8;color:rgba(9,24,44,0.85)\">\n          <li>Sunset-golden aspirational wide shots — that's NR's booking language<\u002Fli>\n          <li>People-centric lifestyle scenes, food, events — that's Hello's editorial territory<\u002Fli>\n          <li>Agent portraits or handshake imagery — that's C&amp;C's counsel territory<\u002Fli>\n          <li>Stock imagery of generic coastal towns; every photo is verifiably Nantucket<\u002Fli>\n          <li>Color washes, brand-blue multiply overlays (an NR guideline; retired for NH)<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border-radius:12px;padding:22px 26px;border:1px solid rgba(60,60,67,0.12)\">\n      <div style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#6D83A3;margin-bottom:10px\">Icon system<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px\">\n        <ul style=\"margin:0;padding-left:18px;font-size:13px;line-height:1.8;color:rgba(9,24,44,0.85)\">\n          <li>24 px grid, 1.75 px stroke, rounded caps and joins, 2 px corner radius on rects<\u002Fli>\n          <li>Outline by default; <strong>filled variant = active/selected state only<\u002Fstrong> (tab bar, toggled filters)<\u002Fli>\n          <li>Ink #09182C on light surfaces; English Manor for inactive; never Carolina outlines<\u002Fli>\n          <li>One metaphor per concept, fixed forever: book = home guide, page = document, calendar = availability, bubble = messages, shield-check = compliance, circle-check = task<\u002Fli>\n        <\u002Ful>\n        <p style=\"margin:0;font-size:12.5px;line-height:1.7;color:rgba(9,24,44,0.8)\">Source icons from a single geometric outline set (SF Symbols on iOS; Lucide on web) — never mix sets on one surface, never hand-draw, never use emoji as icons. Compliance and status icons always pair with a text label; an icon alone never carries a legal or safety meaning.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"s6\" data-screen-label=\"06 Voice and tone\" style=\"scroll-margin-top:24px;margin-bottom:60px\">\n    <div style=\"font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#15A5E5;margin-bottom:6px\">Section 06<\u002Fdiv>\n    <h2 style=\"margin:0 0 6px;font-size:27px;font-weight:700;letter-spacing:-0.5px\">Voice &amp; tone<\u002Fh2>\n    <p style=\"margin:0 0 18px;max-width:660px;font-size:13.5px;line-height:1.65;color:rgba(9,24,44,0.75)\">Principles: <strong>clear, helpful, non-salesy, respectful of the user's time and property.<\u002Fstrong> NH writes like a competent property manager's best email: states the fact, the reason, and the next step, then stops. No exclamation points in product copy. No urgency theater. No marketing inside service flows — ever.<\u002Fp>\n    <div style=\"background:#fff;border-radius:12px;border:1px solid rgba(60,60,67,0.12);padding:8px 26px;margin-bottom:16px\">\n      <div style=\"display:grid;grid-template-columns:150px 1fr 1fr;gap:16px;padding:12px 0;border-bottom:1px solid rgba(60,60,67,0.08);font-size:10.5px;font-weight:600;letter-spacing:0.6px;text-transform:uppercase;color:#6D83A3\"><span>Moment<\u002Fspan><span style=\"color:#0A7A4B\">Write this<\u002Fspan><span style=\"color:#B42318\">Not this<\u002Fspan><\u002Fdiv>\n      <sc-for list=\"{{ voiceRows }}\" as=\"v\" hint-placeholder-count=\"7\">\n        <div style=\"display:grid;grid-template-columns:150px 1fr 1fr;gap:16px;padding:13px 0;border-bottom:1px solid rgba(60,60,67,0.08);font-size:12.5px;line-height:1.6\">\n          <div style=\"font-weight:600\">{{ v.moment }}<span style=\"display:block;font-size:10px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;color:#6D83A3;margin-top:3px\">{{ v.audience }}<\u002Fspan><\u002Fdiv>\n          <div style=\"color:rgba(9,24,44,0.85)\">“{{ v.good }}”<\u002Fdiv>\n          <div style=\"color:#6D83A3\">“{{ v.bad }}”<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px\">\n      <div style=\"background:#fff;border-radius:12px;padding:22px 26px;border:1px solid rgba(60,60,67,0.12)\">\n        <div style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#6D83A3;margin-bottom:12px\">Handoff language — exact patterns<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:14px;font-size:12.5px;line-height:1.65;color:rgba(9,24,44,0.85)\">\n          <div><span style=\"font-size:10px;font-weight:600;letter-spacing:0.6px;text-transform:uppercase;color:#0369A1;background:#E0F2FE;padding:2px 7px;border-radius:4px\">→ NantucketRentals.com<\u002Fspan><p style=\"margin:6px 0 0\">“Looking at next summer? Booking and availability live on NantucketRentals.com — we'll take you there. Your stay details stay right here.”<\u002Fp><\u002Fdiv>\n          <div><span style=\"font-size:10px;font-weight:600;letter-spacing:0.6px;text-transform:uppercase;color:#074059;background:#D0EDFA;padding:2px 7px;border-radius:4px\">→ Congdon &amp; Coleman adviser<\u002Fspan><p style=\"margin:6px 0 0\">“Valuation and selling decisions deserve a licensed adviser. With your OK, we'll share this property's details with Stephen Maury at Congdon &amp; Coleman, and he'll reach out directly.”<\u002Fp><\u002Fdiv>\n          <div><span style=\"font-size:10px;font-weight:600;letter-spacing:0.6px;text-transform:uppercase;color:#B42318;background:#FEF2F2;padding:2px 7px;border-radius:4px\">Escalation (via Odin)<\u002Fspan><p style=\"margin:6px 0 0\">“We've flagged this to the team — a person will follow up within 2 hours. Reference #4187.”<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:12px 0 0;font-size:11px;color:#6D83A3\">Handoffs always: (1) name the destination brand, (2) state why, (3) obtain consent before sharing data, (4) say what happens next. C&amp;C handoffs name the adviser.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border-radius:12px;padding:22px 26px;border:1px solid rgba(60,60,67,0.12)\">\n        <div style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#6D83A3;margin-bottom:12px\">Disclosure &amp; system-vs-human rules<\u002Fdiv>\n        <div style=\"font-size:12.5px;line-height:1.65;color:rgba(9,24,44,0.85)\">\n          <p style=\"margin:0 0 8px\"><strong>Affiliation footer (product + email):<\u002Fstrong> “Nantucket Houses is operated by the team behind NantucketRentals.com and Congdon &amp; Coleman Real Estate.”<\u002Fp>\n          <p style=\"margin:0 0 8px\"><strong>Listing attribution:<\u002Fstrong> “Listing courtesy of Congdon &amp; Coleman Real Estate, LLC.”<\u002Fp>\n          <p style=\"margin:0 0 12px;font-size:11px;color:#6D83A3\">Canonical strings are governed by shared-standards.md in the brand skill — confirm verbatim wording there before shipping; placement is fixed, wording is not paraphrasable.<\u002Fp>\n          <ul style=\"margin:0;padding-left:18px;line-height:1.8\">\n            <li>System messages never say “I” and are never signed.<\u002Fli>\n            <li>Human messages are signed with a real first name and role.<\u002Fli>\n            <li>Odin (AI) always discloses: “Odin, the Nantucket Houses assistant” — and offers a human path in the same breath.<\u002Fli>\n            <li>A message that needs two brands is misrouted. Split it.<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"s7\" data-screen-label=\"07 Applications\" style=\"scroll-margin-top:24px;margin-bottom:60px\">\n    <div style=\"font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#15A5E5;margin-bottom:6px\">Section 07<\u002Fdiv>\n    <h2 style=\"margin:0 0 6px;font-size:27px;font-weight:700;letter-spacing:-0.5px\">Application system<\u002Fh2>\n    <p style=\"margin:0 0 18px;max-width:660px;font-size:13.5px;line-height:1.65;color:rgba(9,24,44,0.75)\">Where the brand shows up and how affiliation appears in each context.<\u002Fp>\n    <div style=\"background:#fff;border-radius:12px;border:1px solid rgba(60,60,67,0.12);padding:8px 26px;margin-bottom:16px\">\n      <div style=\"display:grid;grid-template-columns:180px 1fr 200px;gap:16px;padding:12px 0;border-bottom:1px solid rgba(60,60,67,0.08);font-size:10.5px;font-weight:600;letter-spacing:0.6px;text-transform:uppercase;color:#6D83A3\"><span>Surface<\u002Fspan><span>Rules<\u002Fspan><span>Affiliation<\u002Fspan><\u002Fdiv>\n      <sc-for list=\"{{ surfaceRows }}\" as=\"s\" hint-placeholder-count=\"6\">\n        <div style=\"display:grid;grid-template-columns:180px 1fr 200px;gap:16px;padding:13px 0;border-bottom:1px solid rgba(60,60,67,0.08);font-size:12.5px;line-height:1.6\">\n          <div style=\"font-weight:600\">{{ s.surface }}<\u002Fdiv>\n          <div style=\"color:rgba(9,24,44,0.85)\">{{ s.rules }}<\u002Fdiv>\n          <div style=\"color:#6D83A3;font-size:11.5px\">{{ s.affiliation }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n      <div style=\"background:#fff;border-radius:12px;border:1px solid rgba(60,60,67,0.12);overflow:hidden\">\n        <div style=\"padding:14px 22px;border-bottom:1px solid rgba(60,60,67,0.08);font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#6D83A3\">Sample · Guest check-in email<\u002Fdiv>\n        <div style=\"padding:22px 26px\">\n          <img src=\"251a65ee-1df5-4a5b-913f-ecb44cf61cd2\" alt=\"\" style=\"width:120px;margin-bottom:16px\">\n          <div style=\"font-size:15px;font-weight:600;margin-bottom:8px\">Your stay at 12 Sankaty Head Rd starts Saturday<\u002Fdiv>\n          <p style=\"margin:0 0 12px;font-size:12.5px;line-height:1.65;color:rgba(9,24,44,0.85)\">Check-in opens at 4:00 PM. Your door code and the home guide are ready in the app — parking, Wi-Fi, and trash day included.<\u002Fp>\n          <span style=\"display:inline-block;background:linear-gradient(180deg,rgba(21,165,229,0.98),rgba(17,132,183,0.92));color:#fff;font-size:12.5px;font-weight:600;padding:10px 18px;border-radius:12px\">Open your stay<\u002Fspan>\n          <p style=\"margin:16px 0 0;font-size:10.5px;line-height:1.6;color:#959DAB;border-top:1px solid rgba(60,60,67,0.08);padding-top:12px\">Nantucket Houses is operated by the team behind NantucketRentals.com and Congdon &amp; Coleman Real Estate. You're receiving this because you have a confirmed booking.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:16px\">\n        <div style=\"background:#fff;border-radius:12px;border:1px solid rgba(60,60,67,0.12);overflow:hidden\">\n          <div style=\"padding:14px 22px;border-bottom:1px solid rgba(60,60,67,0.08);font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#6D83A3\">Sample · Push notifications<\u002Fdiv>\n          <div style=\"padding:16px 22px;display:flex;flex-direction:column;gap:10px\">\n            <sc-for list=\"{{ pushSamples }}\" as=\"p\" hint-placeholder-count=\"3\">\n              <div style=\"background:#F5F9FF;border-radius:12px;padding:11px 14px;display:flex;gap:10px;align-items:flex-start\">\n                <img src=\"48418c60-87b0-4acb-8ca2-d2f04be0f362\" alt=\"\" style=\"width:26px;border-radius:6px;flex:none\">\n                <div><div style=\"font-size:12px;font-weight:600\">{{ p.title }}<\u002Fdiv><div style=\"font-size:11.5px;line-height:1.5;color:rgba(9,24,44,0.8)\">{{ p.body }}<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <p style=\"margin:2px 0 0;font-size:11px;line-height:1.6;color:#6D83A3\">A push is a brand surface. One fact + one next step, under 140 characters, no exclamation points, never promotional. Frequency-capped per the sending-brand matrix.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border-radius:12px;padding:18px 22px;border:1px solid rgba(60,60,67,0.12)\">\n          <div style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#6D83A3;margin-bottom:8px\">Marketing site conversion moments<\u002Fdiv>\n          <p style=\"margin:0;font-size:12.5px;line-height:1.65;color:rgba(9,24,44,0.85)\">One conversion action per page: <strong>eligible-user activation<\u002Fstrong> (“See your home in the app” / “Open your stay”). No booking search, no listing carousels, no valuation CTAs on NH marketing — those route to NR and C&amp;C respectively, labeled as such.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"s8\" data-screen-label=\"08 Digital product system\" style=\"scroll-margin-top:24px;margin-bottom:60px\">\n    <div style=\"font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#15A5E5;margin-bottom:6px\">Section 08<\u002Fdiv>\n    <h2 style=\"margin:0 0 6px;font-size:27px;font-weight:700;letter-spacing:-0.5px\">Website &amp; mobile app elements<\u002Fh2>\n    <p style=\"margin:0 0 22px;max-width:660px;font-size:13.5px;line-height:1.65;color:rgba(9,24,44,0.75)\">Implementable specifications for marketing web and logged-in product, mobile-first. Every behavior here reinforces the organizing-utility role: precise, low-drama, never editorial, never funnel, never counsel.<\u002Fp>\n\n    <h3 style=\"margin:0 0 12px;font-size:17px;font-weight:700\">8.1 · Shared foundations<\u002Fh3>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:14px\">\n      <div style=\"background:#fff;border-radius:12px;padding:18px 22px;border:1px solid rgba(60,60,67,0.12)\">\n        <div style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#6D83A3;margin-bottom:8px\">Breakpoints<\u002Fdiv>\n        <div style=\"font-size:12.5px;line-height:1.9;font-family:ui-monospace,Menlo,monospace\">375 base · 744 md<br>1024 lg · 1280 xl<\u002Fdiv>\n        <p style=\"margin:8px 0 0;font-size:11px;line-height:1.55;color:#6D83A3\">Design at 375 first. Content column max 680 px in product, 1040 px marketing.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border-radius:12px;padding:18px 22px;border:1px solid rgba(60,60,67,0.12)\">\n        <div style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#6D83A3;margin-bottom:8px\">Spacing scale<\u002Fdiv>\n        <div style=\"display:flex;align-items:flex-end;gap:5px;height:52px;margin-bottom:6px\">\n          <sc-for list=\"{{ spaceScale }}\" as=\"sp\" hint-placeholder-count=\"8\"><span style=\"width:16px;background:#A1DBF5;border-radius:3px 3px 0 0;height:{{ sp.h }}px\" title=\"{{ sp.v }}\"><\u002Fspan><\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"font-size:11px;font-family:ui-monospace,Menlo,monospace;color:#6D83A3\">4 · 8 · 12 · 16 · 20 · 24 · 32 · 40<\u002Fdiv>\n        <p style=\"margin:8px 0 0;font-size:11px;line-height:1.55;color:#6D83A3\">4 pt base. Card padding 16–17, screen gutter 16 (20 at md+), section gap 24–32.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border-radius:12px;padding:18px 22px;border:1px solid rgba(60,60,67,0.12)\">\n        <div style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#6D83A3;margin-bottom:8px\">Touch &amp; accessibility<\u002Fdiv>\n        <ul style=\"margin:0;padding-left:16px;font-size:11.5px;line-height:1.7;color:rgba(9,24,44,0.85)\">\n          <li>44×44 px minimum targets, 8 px between adjacent targets<\u002Fli>\n          <li>Text contrast ≥4.5:1; UI chrome ≥3:1<\u002Fli>\n          <li>Visible focus ring: 2 px #0369A1, 2 px offset — never removed<\u002Fli>\n          <li>Focus trapped in sheets/modals; returned on close<\u002Fli>\n          <li>Status conveyed by label + color, never color alone<\u002Fli>\n          <li>Respect reduced-motion: swap movement for opacity<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border-radius:12px;padding:18px 24px;border:1px solid rgba(60,60,67,0.12);margin-bottom:26px\">\n      <div style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#6D83A3;margin-bottom:8px\">Density &amp; surface rules<\u002Fdiv>\n      <p style=\"margin:0;font-size:12.5px;line-height:1.7;color:rgba(9,24,44,0.85)\">One primary action per screen. Lists breathe: 12 px between cards, 16–17 px internal padding. <strong>Glass surfaces<\u002Fstrong> (frosted, blur 48–90) are reserved for floating chrome — tab bar, map controls, sheets. <strong>Opaque white cards<\u002Fstrong> carry data, guides, forms, documents (radius 12 editorial / 24 elevated &amp; listing). Never glass-on-glass on scroll-heavy screens. Screen canvas is always #F2F2F7 — no dark canvas, no hero gradients in product.<\u002Fp>\n    <\u002Fdiv>\n\n    <h3 style=\"margin:0 0 12px;font-size:17px;font-weight:700\">8.2 · Buttons &amp; interactive components<\u002Fh3>\n    <div style=\"background:#fff;border-radius:12px;padding:22px 26px;border:1px solid rgba(60,60,67,0.12);margin-bottom:14px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px\"><div style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#6D83A3\">Live — hover, press, and tab-focus these<\u002Fdiv><span style=\"font-size:11px;color:#959DAB\">radius 12 · height 50 regular / 36 compact · padding 0 20<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:12px;flex-wrap:wrap;align-items:center\">\n        <button style=\"font-family:inherit;cursor:pointer;height:50px;padding:0 22px;border-radius:12px;border:1px solid rgba(255,255,255,0.35);background:linear-gradient(180deg,rgba(21,165,229,0.98),rgba(17,132,183,0.92));color:#fff;font-size:14px;font-weight:600;transition:transform 150ms cubic-bezier(0.2,0,0,1),box-shadow 150ms cubic-bezier(0.2,0,0,1)\" style-hover=\"box-shadow:0 4px 14px rgba(17,132,183,0.35)\" style-active=\"transform:scale(0.97)\" style-focus=\"outline:2px solid #0369A1;outline-offset:2px\">Complete task<\u002Fbutton>\n        <button style=\"font-family:inherit;cursor:pointer;height:50px;padding:0 22px;border-radius:12px;border:1px solid rgba(60,60,67,0.12);background:rgba(255,255,255,0.45);color:#09182C;font-size:14px;font-weight:600;transition:background 150ms cubic-bezier(0.2,0,0,1)\" style-hover=\"background:#F0F9FF\" style-active=\"background:#E0F2FE\" style-focus=\"outline:2px solid #0369A1;outline-offset:2px\">Secondary<\u002Fbutton>\n        <button style=\"font-family:inherit;cursor:pointer;height:50px;padding:0 14px;border-radius:12px;border:none;background:transparent;color:#0369A1;font-size:14px;font-weight:600;transition:background 150ms cubic-bezier(0.2,0,0,1)\" style-hover=\"background:#E0F2FE\" style-active=\"background:#D0EDFA\" style-focus=\"outline:2px solid #0369A1;outline-offset:2px\">Tertiary<\u002Fbutton>\n        <button style=\"font-family:inherit;cursor:pointer;height:50px;padding:0 22px;border-radius:12px;border:none;background:#EB1648;color:#fff;font-size:14px;font-weight:600;transition:filter 150ms cubic-bezier(0.2,0,0,1)\" style-hover=\"filter:brightness(0.94)\" style-active=\"transform:scale(0.97)\" style-focus=\"outline:2px solid #0369A1;outline-offset:2px\">Delete document<\u002Fbutton>\n        <button style=\"font-family:inherit;height:50px;padding:0 22px;border-radius:12px;border:none;background:#DEE1EB;color:#959DAB;font-size:14px;font-weight:600;cursor:not-allowed\">Disabled<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ toggleLoading }}\" style=\"font-family:inherit;cursor:pointer;height:50px;padding:0 22px;border-radius:12px;border:1px solid rgba(255,255,255,0.35);background:linear-gradient(180deg,rgba(21,165,229,0.98),rgba(17,132,183,0.92));color:#fff;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:9px;min-width:150px;justify-content:center\">\n          <sc-if value=\"{{ loading }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width:15px;height:15px;border:2px solid rgba(255,255,255,0.4);border-top-color:#fff;border-radius:999px;animation:nhspin 700ms linear infinite\"><\u002Fspan><\u002Fsc-if>\n          {{ loadingLabel }}\n        <\u002Fbutton>\n      <\u002Fdiv>\n      <p style=\"margin:14px 0 0;font-size:11.5px;line-height:1.6;color:#6D83A3\">Loading: label stays visible next to a 15 px spinner; button never collapses to spinner-only; width locked during load. Compact size (36 px) is web-only or paired with an adjacent 44 px hit area.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border-radius:12px;border:1px solid rgba(60,60,67,0.12);padding:8px 26px;margin-bottom:14px\">\n      <div style=\"display:grid;grid-template-columns:110px repeat(4,1fr);gap:12px;padding:12px 0;border-bottom:1px solid rgba(60,60,67,0.08);font-size:10.5px;font-weight:600;letter-spacing:0.6px;text-transform:uppercase;color:#6D83A3\"><span>State<\u002Fspan><span>Primary<\u002Fspan><span>Secondary<\u002Fspan><span>Tertiary<\u002Fspan><span>Destructive<\u002Fspan><\u002Fdiv>\n      <sc-for list=\"{{ btnStates }}\" as=\"b\" hint-placeholder-count=\"6\">\n        <div style=\"display:grid;grid-template-columns:110px repeat(4,1fr);gap:12px;padding:11px 0;border-bottom:1px solid rgba(60,60,67,0.08);font-size:11.5px;line-height:1.55;color:rgba(9,24,44,0.85)\">\n          <div style=\"font-weight:600\">{{ b.state }}<\u002Fdiv><div>{{ b.primary }}<\u002Fdiv><div>{{ b.secondary }}<\u002Fdiv><div>{{ b.tertiary }}<\u002Fdiv><div>{{ b.destructive }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:26px\">\n      <div style=\"background:#fff;border-radius:12px;padding:20px 24px;border:1px solid rgba(60,60,67,0.12)\">\n        <div style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#6D83A3;margin-bottom:10px\">Motion<\u002Fdiv>\n        <div style=\"font-size:12px;line-height:2;font-family:ui-monospace,Menlo,monospace;color:rgba(9,24,44,0.85)\">state change &nbsp;150ms<br>component &nbsp;&nbsp;&nbsp;220ms<br>sheet/nav &nbsp;&nbsp;&nbsp;&nbsp;320ms<br>easing &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;cubic-bezier(0.2, 0, 0, 1)<\u002Fdiv>\n        <p style=\"margin:8px 0 0;font-size:11.5px;line-height:1.6;color:#6D83A3\">Press = scale 0.97, no bounce, no spring overshoot. Nothing animates that isn't responding to the user.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#F5F9FF;border:1px solid #BAE6FD;border-radius:12px;padding:20px 24px\">\n        <div style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#0369A1;margin-bottom:10px\">High-stakes &amp; irreversible actions<\u002Fdiv>\n        <ul style=\"margin:0;padding-left:16px;font-size:12px;line-height:1.75;color:rgba(9,24,44,0.85)\">\n          <li>Two steps, always: action → confirmation sheet restating consequence in one plain sentence<\u002Fli>\n          <li>Confirmation button names the action (“Submit agreement”), never “OK” / “Yes”<\u002Fli>\n          <li>Destructive red reserved for true loss; availability changes and document submission confirm on primary blue<\u002Fli>\n          <li>5-second undo toast where reversal is possible; state the irreversibility where it isn't<\u002Fli>\n          <li>No countdown pressure, no double-negatives (“Cancel cancellation”)<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 style=\"margin:0 0 12px;font-size:17px;font-weight:700\">8.3 · Forms &amp; inputs<\u002Fh3>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:14px\">\n      <div style=\"background:#fff;border-radius:12px;padding:22px 26px;border:1px solid rgba(60,60,67,0.12)\">\n        <div style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#6D83A3;margin-bottom:14px\">Live — type an email, then blur<\u002Fdiv>\n        <label style=\"display:block;font-size:12px;font-weight:600;margin-bottom:6px\">Email for stay updates<\u002Flabel>\n        <input value=\"{{ emailVal }}\" sc-camel-on-change=\"{{ onEmail }}\" sc-camel-on-blur=\"{{ onEmailBlur }}\" placeholder=\"you@example.com\" sc-camel-input-mode=\"email\" style=\"box-sizing:border-box;width:100%;height:48px;padding:0 14px;border-radius:12px;border:1.5px solid {{ emailBorder }};background:#fff;font-family:inherit;font-size:15px;color:#09182C;outline:none;transition:border-color 150ms cubic-bezier(0.2,0,0,1),box-shadow 150ms cubic-bezier(0.2,0,0,1)\" style-focus=\"border-color:#15A5E5;box-shadow:0 0 0 3px rgba(21,165,229,0.18)\">\n        <div style=\"min-height:20px;margin-top:6px;font-size:11.5px;line-height:1.5;color:{{ emailMsgColor }}\">{{ emailMsg }}<\u002Fdiv>\n        <label style=\"display:block;font-size:12px;font-weight:600;margin:10px 0 6px\">Notes for the team<\u002Flabel>\n        <textarea placeholder=\"Anything we should know before arrival\" rows=\"2\" style=\"box-sizing:border-box;width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid rgba(60,60,67,0.18);background:#fff;font-family:inherit;font-size:14px;color:#09182C;outline:none;resize:vertical\" style-focus=\"border-color:#15A5E5;box-shadow:0 0 0 3px rgba(21,165,229,0.18)\"><\u002Ftextarea>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px\">\n          <div><label style=\"display:block;font-size:12px;font-weight:600;margin-bottom:6px\">Arrival date<\u002Flabel><input value=\"Sat, Aug 22\" readonly=\"\" style=\"box-sizing:border-box;width:100%;height:44px;padding:0 14px;border-radius:12px;border:1.5px solid rgba(60,60,67,0.18);background:#fff;font-family:inherit;font-size:14px;color:#09182C;font-variant-numeric:tabular-nums\"><\u002Fdiv>\n          <div><label style=\"display:block;font-size:12px;font-weight:600;margin-bottom:6px\">Guests<\u002Flabel><sc-raw-select style=\"box-sizing:border-box;width:100%;height:44px;padding:0 10px;border-radius:12px;border:1.5px solid rgba(60,60,67,0.18);background:#fff;font-family:inherit;font-size:14px;color:#09182C\"><option>4 guests<\u002Foption><option>2 guests<\u002Foption><option>6 guests<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border-radius:12px;padding:22px 26px;border:1px solid rgba(60,60,67,0.12)\">\n        <div style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#6D83A3;margin-bottom:12px\">Spec<\u002Fdiv>\n        <ul style=\"margin:0;padding-left:16px;font-size:12px;line-height:1.8;color:rgba(9,24,44,0.85)\">\n          <li>Height 48 px (44 min) · radius 12 · border 1.5 px rgba(60,60,67,0.18)<\u002Fli>\n          <li>Focus: Carolina border + 3 px rgba(21,165,229,0.18) ring — one focus look everywhere<\u002Fli>\n          <li>Error: border #B42318 + caption below; field keeps its value; message says how to fix, not what's wrong with the user<\u002Fli>\n          <li>Success: quiet — #0A7A4B check + caption only where confirmation matters (documents, payments context)<\u002Fli>\n          <li>Disabled: #DEE1EB fill, #959DAB text, no border change<\u002Fli>\n          <li>Labels always above the field, 12/600; placeholder is an example, never the label<\u002Fli>\n          <li>Mobile: correct <code style=\"font-family:ui-monospace,Menlo,monospace;font-size:11px\">inputmode<\u002Fcode>/<code style=\"font-family:ui-monospace,Menlo,monospace;font-size:11px\">autocomplete<\u002Fcode>; 16 px font minimum to prevent iOS zoom; field scrolls above keyboard with 12 px clearance<\u002Fli>\n          <li>Date pickers: native OS control in-app; text input with format hint on web<\u002Fli>\n          <li>File upload: full-width dashed drop card (radius 12) listing accepted types + max size; progress bar during upload; row with filename + remove after<\u002Fli>\n          <li>Multi-step: one topic per step, numbered “Step 2 of 3”, progress persists across sessions, back never loses data<\u002Fli>\n          <li>Validate on blur, re-validate on change after first error; never on first keystroke; submit disabled only while request is in flight<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 style=\"margin:0 0 12px;font-size:17px;font-weight:700\">8.4 · Navigation &amp; information architecture<\u002Fh3>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:26px\">\n      <div style=\"background:#fff;border-radius:12px;padding:22px 26px;border:1px solid rgba(60,60,67,0.12)\">\n        <div style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#6D83A3;margin-bottom:12px\">Mobile tab bar<\u002Fdiv>\n        <div style=\"border-radius:999px;border:1px solid rgba(60,60,67,0.12);background:rgba(255,255,255,0.82);backdrop-filter:blur(20px);box-shadow:0 4px 14px rgba(0,0,0,0.08);padding:8px 10px;display:flex;justify-content:space-around;margin-bottom:12px\">\n          <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"5\">\n            <span style=\"display:flex;flex-direction:column;align-items:center;gap:3px;min-width:52px;padding:4px 0\">\n              <span style=\"width:20px;height:20px;border-radius:6px;background:{{ t.fill }};border:{{ t.border }}\"><\u002Fspan>\n              <span style=\"font-size:9.5px;font-weight:600;color:{{ t.color }}\">{{ t.label }}<\u002Fspan>\n            <\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <ul style=\"margin:0;padding-left:16px;font-size:12px;line-height:1.75;color:rgba(9,24,44,0.85)\">\n          <li>Frosted glass (blur 90), floating with safe-area inset; hidden on content pages and inside flows<\u002Fli>\n          <li>Max 5 slots; active = filled icon + ink label; inactive = outline + English Manor<\u002Fli>\n          <li>Owner mode: Home · Documents · Market · Messages · More. Guest mode: My Stay · Home Guide · Messages · More<\u002Fli>\n          <li>Re-tapping the active tab scrolls its stack to top; tab switch preserves each stack's position<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border-radius:12px;padding:22px 26px;border:1px solid rgba(60,60,67,0.12)\">\n        <div style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#6D83A3;margin-bottom:12px\">Headers, back-stack &amp; web nav<\u002Fdiv>\n        <ul style=\"margin:0;padding-left:16px;font-size:12px;line-height:1.75;color:rgba(9,24,44,0.85)\">\n          <li>Large-title headers on tab roots (28/700), collapsing to 17/700 nav title on scroll<\u002Fli>\n          <li>Stack screens: native back chevron + title; swipe-back always enabled; back never re-triggers actions or loses form state<\u002Fli>\n          <li>Sticky headers are opaque white with hairline shadow after 8 px of scroll — content never scrolls illegibly beneath<\u002Fli>\n          <li>Sheets for subtasks (detail, filters, confirmations) — radius 24 top, grabber, dimmed scrim rgba(12,20,40,0.22)<\u002Fli>\n          <li>Web: single top bar, wordmark left, section links + one primary CTA right; hamburger below 744 px with full-screen sheet, links ≥48 px tall<\u002Fli>\n          <li>Active section: 600 weight + 2 px Carolina underline — no pill highlights in web nav<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 style=\"margin:0 0 12px;font-size:17px;font-weight:700\">8.5 · Scroll, loading &amp; micro-interactions<\u002Fh3>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:14px\">\n      <div style=\"background:#fff;border-radius:12px;padding:18px 22px;border:1px solid rgba(60,60,67,0.12)\">\n        <div style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#6D83A3;margin-bottom:10px\">Skeleton — live<\u002Fdiv>\n        <div style=\"border-radius:12px;border:1px solid rgba(60,60,67,0.1);padding:12px\">\n          <div style=\"height:74px;border-radius:8px;background:linear-gradient(90deg,#E5E5EA 25%,rgba(255,255,255,0.55) 50%,#E5E5EA 75%);background-size:240px 100%;animation:nhshimmer 1350ms linear infinite\"><\u002Fdiv>\n          <div style=\"height:12px;width:70%;border-radius:4px;margin-top:10px;background:linear-gradient(90deg,#E5E5EA 25%,rgba(255,255,255,0.55) 50%,#E5E5EA 75%);background-size:240px 100%;animation:nhshimmer 1350ms linear infinite\"><\u002Fdiv>\n          <div style=\"height:12px;width:45%;border-radius:4px;margin-top:6px;background:linear-gradient(90deg,#E5E5EA 25%,rgba(255,255,255,0.55) 50%,#E5E5EA 75%);background-size:240px 100%;animation:nhshimmer 1350ms linear infinite\"><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:10px 0 0;font-size:11px;line-height:1.55;color:#6D83A3\">Base #E5E5EA, white sweep, 1350 ms cycle. Skeletons mirror real layout; shown after 300 ms delay, never for cached content.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border-radius:12px;padding:18px 22px;border:1px solid rgba(60,60,67,0.12)\">\n        <div style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#6D83A3;margin-bottom:10px\">Empty state — pattern<\u002Fdiv>\n        <div style=\"border:1px dashed rgba(60,60,67,0.2);border-radius:12px;padding:20px 16px;text-align:center\">\n          <div style=\"width:34px;height:34px;border-radius:10px;background:#E0F2FE;margin:0 auto 10px\"><\u002Fdiv>\n          <div style=\"font-size:13px;font-weight:600\">No documents yet<\u002Fdiv>\n          <div style=\"font-size:11.5px;line-height:1.5;color:#6D83A3;margin:4px 0 10px\">Agreements and statements will appear here when they're ready.<\u002Fdiv>\n          <span style=\"font-size:12px;font-weight:600;color:#0369A1\">Upload a document<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:10px 0 0;font-size:11px;line-height:1.55;color:#6D83A3\">Icon + one factual line + one action. Never apologetic, never illustrated scenes, never sales prompts.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border-radius:12px;padding:18px 22px;border:1px solid rgba(60,60,67,0.12)\">\n        <div style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#6D83A3;margin-bottom:10px\">Lists &amp; refresh<\u002Fdiv>\n        <ul style=\"margin:0;padding-left:16px;font-size:11.5px;line-height:1.7;color:rgba(9,24,44,0.85)\">\n          <li>Native pull-to-refresh on every list; spinner in ink, no custom art<\u002Fli>\n          <li>Paginate at 20–30 items with auto-load; “Showing 40 of 112” counter for long lists — no true infinite scroll on documents or compliance (users need to reach the end)<\u002Fli>\n          <li>New items slide-fade in over 220 ms; no reordering under the user's finger<\u002Fli>\n          <li>Section reveals: 8 px rise + fade, 200 ms, once per session, marketing only — never in product lists; no parallax, no scroll-jacking, no pinned takeovers<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border-radius:12px;padding:18px 24px;border:1px solid rgba(60,60,67,0.12);margin-bottom:26px\">\n      <div style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:#6D83A3;margin-bottom:8px\">Micro-interaction budget<\u002Fdiv>\n      <p style=\"margin:0;font-size:12.5px;line-height:1.7;color:rgba(9,24,44,0.85)\">Every animation answers “what just happened?” — press feedback (150 ms), state confirmation (check morph, 220 ms), spatial continuity (sheet rise, 320 ms). Haptics: light impact on task completion and toggle only. Nothing loops, nothing pulses for attention, nothing celebrates (no confetti — task completion gets a checkmark and the next step). If an interaction would feel at home in a booking funnel or a lifestyle app, it's out.<\u002Fp>\n    <\u002Fdiv>\n\n    <h3 style=\"margin:0 0 12px;font-size:17px;font-weight:700\">8.6 · Product surfaces — owner vs guest<\u002Fh3>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-bottom:16px\">\n      <div>\n        <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:10px\"><span style=\"font-size:10px;font-weight:600;letter-spacing:0.6px;text-transform:uppercase;color:#0369A1;background:#E0F2FE;padding:2px 7px;border-radius:4px\">Owner<\u002Fspan><span style=\"font-size:12px;font-weight:600\">Home dashboard<\u002Fspan><\u002Fdiv>\n        <div style=\"border-radius:34px;border:1px solid rgba(60,60,67,0.18);background:#F2F2F7;padding:10px;box-shadow:0 6px 22px rgba(9,24,44,0.08)\">\n          <div style=\"border-radius:26px;background:#F2F2F7;overflow:hidden\">\n            <div style=\"padding:14px 16px 8px;display:flex;justify-content:space-between;align-items:center\"><span style=\"font-size:16px;font-weight:700;letter-spacing:-0.3px\">12 Sankaty Head Rd<\u002Fspan><span style=\"width:24px;height:24px;border-radius:999px;background:#D0EDFA\"><\u002Fspan><\u002Fdiv>\n            <div style=\"margin:6px 12px;background:#fff;border-radius:12px;padding:12px 14px;border:1px solid rgba(60,60,67,0.1)\">\n              <div style=\"display:flex;justify-content:space-between;align-items:baseline\"><span style=\"font-size:11px;font-weight:600;letter-spacing:0.6px;text-transform:uppercase;color:#6D83A3\">Activation<\u002Fspan><span style=\"font-size:11px;font-weight:600;color:#0369A1\">3 of 5<\u002Fspan><\u002Fdiv>\n              <div style=\"height:5px;border-radius:999px;background:#E8EDF3;margin-top:8px\"><span style=\"display:block;height:5px;width:60%;border-radius:999px;background:linear-gradient(90deg,#15A5E5,#1184B7)\"><\u002Fspan><\u002Fdiv>\n              <div style=\"font-size:11px;color:rgba(9,24,44,0.8);margin-top:8px\">Next: confirm trash pickup day<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin:8px 12px;background:#fff;border-radius:12px;padding:12px 14px;border:1px solid rgba(60,60,67,0.1)\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center\"><span style=\"font-size:12px;font-weight:600\">Rental agreement<\u002Fspan><span style=\"font-size:9.5px;font-weight:600;letter-spacing:0.6px;text-transform:uppercase;color:#B45309;background:#FEF3C7;padding:2px 7px;border-radius:4px\">Due Sep 1<\u002Fspan><\u002Fdiv>\n              <div style=\"font-size:11px;color:#6D83A3;margin-top:3px\">2026 season · awaiting your signa
